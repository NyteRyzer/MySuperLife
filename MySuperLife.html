<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MySuperLife</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #14112b;
  --panel: #1f1a3d;
  --panel-2: #2a2452;
  --ink: #f3f0ff;
  --muted: #a49fc7;
  --line: #3a3370;
  --accent: #ffd23f;
  --hero: #3fa9ff;
  --villain: #e0435a;
  --power: #b15cff;
  --ok: #3ddc84;
  --warn: #ffb020;
  --bad: #ff4d5e;
  --radius: 14px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(circle at 20% 0%, #2b1f63 0%, var(--bg) 55%) fixed;
  color: var(--ink);
  font-family: 'Nunito', system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

#app {
  max-width: 520px; height: 100%; margin: 0 auto;
  display: flex; flex-direction: column; position: relative;
  background: rgba(10, 8, 30, 0.35);
  border-left: 1px solid var(--line); border-right: 1px solid var(--line);
}

/* ---------- top bar ---------- */
#topbar {
  display: flex; align-items: center; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
  background: var(--panel); border-bottom: 3px solid var(--accent);
}
#avatar { font-size: 34px; width: 48px; height: 48px; display: grid; place-items: center; background: var(--panel-2); border-radius: 50%; border: 2px solid var(--line); }
.who { flex: 1; min-width: 0; }
#name { font-weight: 900; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sub { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.right { display: flex; align-items: center; gap: 8px; }
#money { font-weight: 900; color: var(--ok); font-size: 16px; }
#money.neg { color: var(--bad); }
#menu-btn { background: none; border: none; font-size: 22px; padding: 4px 6px; }

.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-weight: 800; font-size: 11.5px; color: #fff; background: var(--power); }
.badge.hero { background: var(--hero); }
.badge.villain { background: var(--villain); }
.badge.big { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-size: 22px; letter-spacing: 1px; padding: 4px 14px; margin: 4px 0 10px; }

/* ---------- log ---------- */
#log { flex: 1; overflow-y: auto; padding: 12px 14px 20px; scroll-behavior: smooth; }
.year { margin-bottom: 14px; }
.year-age { font-weight: 900; color: var(--accent); font-size: 14px; margin-bottom: 4px; }
.year p { margin: 3px 0; font-size: 14.5px; line-height: 1.45; }
.year p.good { color: #8ff0b8; }
.year p.bad { color: #ff9aa5; }
.year p.hint { color: var(--muted); font-style: italic; }
.year p.super { color: #e5c6ff; font-weight: 700; }

/* ---------- stats ---------- */
#stats { padding: 8px 14px; background: var(--panel); border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
.stat { display: grid; grid-template-columns: 92px 1fr 34px; align-items: center; gap: 6px; font-size: 11.5px; }
.stat-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-weight: 700; }
.stat-val { text-align: right; font-weight: 800; }
.bar { height: 9px; background: #0d0b20; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.fill { height: 100%; border-radius: 99px; transition: width .35s ease; }

/* ---------- nav ---------- */
#nav {
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
  padding: 6px 6px calc(8px + env(safe-area-inset-bottom));
  background: var(--panel-2); border-top: 1px solid var(--line);
}
#nav button { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 800; color: var(--muted); padding: 4px 0; }
#nav button span { font-size: 22px; }
#age-btn span {
  width: 62px; height: 62px; margin-top: -26px; border-radius: 50%;
  display: grid; place-items: center; font-size: 34px !important; font-weight: 900; color: #1a1300;
  background: var(--accent); border: 4px solid var(--panel-2); box-shadow: 0 4px 18px rgba(255, 210, 63, .45);
  transition: transform .1s;
}
#age-btn:active span { transform: scale(.92); }
#age-btn { color: var(--accent) !important; }
#nav-powers.locked span { filter: grayscale(1) opacity(.5); }
#nav-powers.glow span { animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 8px var(--power)); transform: scale(1.08); } }

/* ---------- sheet ---------- */
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0; top: 70px; z-index: 20;
  background: var(--panel); border-top: 3px solid var(--accent); border-radius: 18px 18px 0 0;
  display: flex; flex-direction: column; animation: up .2s ease;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet-head h3 { flex: 1; margin: 0; font-family: 'Bangers', Impact, 'Arial Black', sans-serif; letter-spacing: 1px; font-size: 24px; font-weight: 400; }
#sheet-close { background: var(--panel-2); border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; }
#sheet-body { flex: 1; overflow-y: auto; padding: 12px 14px calc(30px + env(safe-area-inset-bottom)); }

.section { margin-bottom: 16px; }
.section-title { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); margin: 4px 2px 8px; }
.row {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 11px 12px; margin-bottom: 7px; transition: transform .08s, background .15s;
}
.row:active { transform: scale(.98); background: #352d66; }
.row.disabled { opacity: .45; }
.row.danger b { color: #ff9aa5; }
.row-emoji { font-size: 24px; width: 30px; text-align: center; }
.row-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.row-main b { font-size: 15px; }
.row-main small { color: var(--muted); font-size: 12px; margin-top: 1px; }
.row-arrow { color: var(--muted); font-size: 22px; }
.info { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; font-size: 14px; line-height: 1.7; }
.info .stat { margin-top: 4px; }
.muted { color: var(--muted); }

.locked-panel { text-align: center; padding: 30px 14px; }
.locked-panel .big { font-size: 72px; animation: glow 2s infinite; }
.locked-panel h3 { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-weight: 400; letter-spacing: 1px; font-size: 26px; margin: 10px 0; }
.locked-panel p { line-height: 1.5; }

/* hero card */
.hero-card {
  border-radius: 18px; padding: 14px; margin-bottom: 16px; border: 2px solid var(--power);
  background: linear-gradient(145deg, #3a1f6b, #1f1a3d);
}
.hero-card.hero { border-color: var(--hero); background: linear-gradient(145deg, #173a6b, #1f1a3d); }
.hero-card.villain { border-color: var(--villain); background: linear-gradient(145deg, #5c1730, #1f1a3d); }
.hc-top { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.hc-emoji { font-size: 46px; }
.hc-name { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-size: 30px; letter-spacing: 1.5px; line-height: 1; text-shadow: 2px 2px 0 rgba(0,0,0,.5); }
.hc-sub { font-size: 12.5px; color: #d5d0f5; margin-top: 3px; }
.hc-powers { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.pill { background: rgba(255,255,255,.12); padding: 4px 10px; border-radius: 99px; font-weight: 800; font-size: 13px; }
.hc-origin { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.hero-card .stat { grid-template-columns: 100px 1fr 36px; margin-bottom: 5px; }
.hc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 8px; text-align: center; }
.hc-grid div { background: rgba(0,0,0,.25); border-radius: 10px; padding: 6px 2px; display: flex; flex-direction: column; }
.hc-grid b { font-size: 14px; }
.hc-grid small { font-size: 10px; color: var(--muted); }
.hc-extra { font-size: 13px; line-height: 1.7; }
.hc-extra .nemesis { color: #ffb3bd; font-weight: 700; }

/* ---------- modal ---------- */
#modal {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 18px;
  background: rgba(5, 3, 18, .72); backdrop-filter: blur(3px);
}
.card {
  width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto;
  background: var(--panel); border: 3px solid var(--accent); border-radius: 20px; padding: 20px 18px 16px;
  text-align: center; box-shadow: 0 10px 50px rgba(0,0,0,.6); animation: pop .22s cubic-bezier(.2,1.4,.5,1);
}
.card.origin { border-color: var(--power); background: radial-gradient(circle at 50% 0%, #4a2591, var(--panel) 70%); box-shadow: 0 0 60px rgba(177, 92, 255, .45); }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.card-emoji { font-size: 56px; line-height: 1.1; }
.card h2 { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-weight: 400; letter-spacing: 1.5px; font-size: 30px; margin: 6px 0 8px; color: var(--accent); }
.card-text { font-size: 15px; line-height: 1.5; margin-bottom: 14px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choices.grid { display: grid; grid-template-columns: 1fr 1fr; }
.choice {
  background: var(--panel-2); border: 2px solid var(--line); border-radius: 12px; padding: 12px;
  font-weight: 800; font-size: 15px; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.choice:active { transform: scale(.97); }
.choice:hover { border-color: var(--accent); }
.choice small { font-weight: 600; font-size: 11.5px; color: var(--muted); }
.choice.hero { background: var(--hero); border-color: #8fd0ff; color: #fff; font-size: 17px; }
.choice.villain { background: var(--villain); border-color: #ff9aa5; color: #fff; font-size: 17px; }
.name-input {
  width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--power); background: #0d0b20; color: var(--ink);
  font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-size: 24px; letter-spacing: 1px; text-align: center; margin-bottom: 10px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 14px; }
.chip { background: rgba(255,255,255,.1); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
.chip:active { background: var(--power); }

/* ---------- screens ---------- */
.screen {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px; overflow-y: auto;
  background: radial-gradient(circle at 50% 10%, #3b2380 0%, var(--bg) 65%);
}
.start-card { width: 100%; max-width: 400px; text-align: center; }
.start-card h2 { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-weight: 400; font-size: 34px; letter-spacing: 1.5px; margin: 6px 0; }
.start-card p { line-height: 1.5; }
.logo {
  font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-size: 64px; letter-spacing: 2px; line-height: 1; color: var(--accent);
  text-shadow: 3px 3px 0 var(--villain), 6px 6px 0 rgba(0,0,0,.4); transform: rotate(-3deg); margin: 10px 0 6px;
}
.logo span { color: #fff; font-size: 44px; }
.tagline { color: var(--muted); margin-bottom: 22px; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.form input, .form select {
  width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 15px;
}
.big-btn {
  display: block; width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 14px; border: none;
  background: var(--accent); color: #1a1300; font-weight: 900; font-size: 17px; box-shadow: 0 4px 0 #b8901a;
}
.big-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8901a; }
.big-btn.alt { background: var(--hero); color: #fff; box-shadow: 0 4px 0 #1f6cb0; }
.big-btn.ghost { background: var(--panel-2); color: var(--ink); box-shadow: 0 4px 0 #120f2a; }
#death .info { text-align: left; }

#toast {
  position: fixed; left: 50%; bottom: 120px; transform: translate(-50%, 20px); z-index: 60;
  background: #0d0b20; border: 2px solid var(--accent); color: var(--ink); padding: 10px 18px; border-radius: 99px;
  font-weight: 800; font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 380px) {
  #stats { grid-template-columns: 1fr; }
  .stat { grid-template-columns: 100px 1fr 36px; }
}

</style>
</head>
<body>
<div id="app">
    <header id="topbar">
      <div id="avatar">👶</div>
      <div class="who">
        <div id="name"></div>
        <div id="sub"></div>
      </div>
      <div class="right">
        <div id="money">$0</div>
        <button id="menu-btn" aria-label="Menu">☰</button>
      </div>
    </header>

    <main id="log"></main>

    <section id="stats"></section>

    <nav id="nav">
      <button data-sheet="career"><span>💼</span>Career</button>
      <button data-sheet="people"><span>❤️</span>People</button>
      <button id="age-btn"><span>＋</span>Age</button>
      <button data-sheet="activities"><span>🎯</span>Activities</button>
      <button data-sheet="powers" id="nav-powers"><span>⚡</span>Powers</button>
    </nav>

    <div id="sheet" hidden>
      <div class="sheet-head">
        <h3 id="sheet-title"></h3>
        <button id="sheet-close" aria-label="Close">✕</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="modal" hidden></div>
  <div id="start" class="screen" hidden></div>
  <div id="death" class="screen" hidden></div>
  <div id="toast"></div>
<script>
// Static game data: names, places, powers, origins, jobs, gear.

const FIRST_NAMES = {
  m: ['Liam', 'Noah', 'Marcus', 'Elijah', 'Mateo', 'Jalen', 'Ethan', 'Caleb', 'Andre', 'Kai', 'Darius', 'Owen',
    'Isaiah', 'Leo', 'Miles', 'Xavier', 'Theo', 'Malik', 'Diego', 'Jaden', 'Wesley', 'Adrian', 'Jordan', 'Tyrone',
    'Hiro', 'Ravi', 'Felix', 'Omar', 'Peter', 'Bruce', 'Clark', 'Victor', 'Silas', 'Grant'],
  f: ['Olivia', 'Ava', 'Maya', 'Zoe', 'Aaliyah', 'Sofia', 'Imani', 'Harper', 'Luna', 'Nia', 'Chloe', 'Jasmine',
    'Aria', 'Kira', 'Layla', 'Gabriela', 'Riley', 'Destiny', 'Naomi', 'Priya', 'Mei', 'Sasha', 'Diana', 'Lois',
    'Jessica', 'Talia', 'Iris', 'Raven', 'Selena', 'Monica', 'Tiana', 'Brielle', 'Kendra', 'Faith'],
};

const LAST_NAMES = ['Carter', 'Johnson', 'Rivera', 'Nguyen', 'Williams', 'Brooks', 'Okafor', 'Kim', 'Patel', 'Garcia',
  'Thompson', 'Reyes', 'Stone', 'Knight', 'Parker', 'Wayne', 'Banner', 'Cross', 'Hale', 'Steele', 'Vance', 'Monroe',
  'Bishop', 'Price', 'Sato', 'Diaz', 'Coleman', 'Ford', 'Hayes', 'Lee', 'Morrison', 'Black', 'Grey', 'Holt'];

const CITIES = ['Port Valor', 'Skyline City', 'Ironbay', 'Crescent Harbor', 'New Avalon', 'Granite Falls',
  'Emerald Bay', 'Titan City', 'Blackwater', 'Solace Heights'];

// Power perks (all optional):
//   fight   – bonus to every fight/mission roll
//   stealth – multiplier on suspicion gained (lower = better at hiding)
//   energy  – extra super actions per year
//   heal    – health regained every year
//   armor   – multiplier on damage taken
//   money   – % bonus to villain heists
//   smarts  – one-time smarts boost on awakening
//   looks   – one-time looks boost on awakening
//   gadget  – multiplier on gadget/base prices
//   escape  – bonus % to escape from capture / prison
//   wipe    – can erase memories
const POWERS = {
  strength: { name: 'Super Strength', emoji: '💪', kind: 'power', desc: 'You can lift a city bus over your head like it’s a backpack.', verbs: ['hurled a car at', 'punched clean through the armor of', 'body-slammed'], fight: 12, armor: 0.8 },
  flight: { name: 'Flight', emoji: '🦅', kind: 'power', desc: 'You can soar above the clouds faster than a fighter jet.', verbs: ['dive-bombed', 'snatched up and dropped', 'flew circles around'], fight: 6, energy: 1, escape: 20 },
  speed: { name: 'Super Speed', emoji: '⚡', kind: 'power', desc: 'You move so fast the world looks frozen.', verbs: ['landed a thousand punches on', 'ran circles around', 'disarmed'], fight: 8, energy: 1, escape: 25 },
  telekinesis: { name: 'Telekinesis', emoji: '🌀', kind: 'power', desc: 'You can move anything with your mind.', verbs: ['flung debris at', 'lifted and pinned', 'crushed the weapons of'], fight: 11 },
  telepathy: { name: 'Telepathy', emoji: '🧠', kind: 'power', desc: 'You can read minds — and erase memories.', verbs: ['scrambled the mind of', 'put to sleep', 'turned the henchmen against'], fight: 7, smarts: 10, wipe: true, stealth: 0.8 },
  pyro: { name: 'Pyrokinesis', emoji: '🔥', kind: 'power', desc: 'You can summon and control fire.', verbs: ['engulfed', 'launched a fireball at', 'melted the weapons of'], fight: 13 },
  cryo: { name: 'Cryokinesis', emoji: '❄️', kind: 'power', desc: 'You can freeze anything solid.', verbs: ['froze', 'encased in ice', 'iced the getaway car of'], fight: 11 },
  electro: { name: 'Electrokinesis', emoji: '🌩️', kind: 'power', desc: 'Lightning crackles at your fingertips.', verbs: ['electrocuted', 'blasted lightning at', 'short-circuited'], fight: 12, money: 10 },
  invisibility: { name: 'Invisibility', emoji: '👻', kind: 'power', desc: 'You can vanish from sight at will.', verbs: ['ambushed', 'snuck up on', 'tripped up'], fight: 5, stealth: 0.4, money: 20, escape: 35 },
  shapeshift: { name: 'Shapeshifting', emoji: '🦎', kind: 'power', desc: 'You can look like anyone — or anything.', verbs: ['impersonated and fooled', 'turned into a gorilla and pummeled', 'tricked'], fight: 7, stealth: 0.4, looks: 10, escape: 30, money: 15 },
  healing: { name: 'Healing Factor', emoji: '🩹', kind: 'power', desc: 'Your body heals from almost anything. You may live a very long time.', verbs: ['shrugged off attacks from', 'outlasted', 'wore down'], fight: 6, heal: 12, armor: 0.6 },
  teleport: { name: 'Teleportation', emoji: '✨', kind: 'power', desc: 'You can blink from place to place instantly.', verbs: ['teleported behind', 'blinked around', 'teleported away the weapons of'], fight: 8, energy: 1, escape: 60 },
  time: { name: 'Time Manipulation', emoji: '⏳', kind: 'power', desc: 'You can slow, stop, and even rewind time for a few seconds.', verbs: ['froze time around', 'rewound the attack of', 'outmaneuvered'], fight: 16, escape: 40 },
  weather: { name: 'Weather Control', emoji: '🌪️', kind: 'power', desc: 'Storms, lightning and hurricanes obey you.', verbs: ['summoned a tornado on', 'struck with lightning', 'buried in hail'], fight: 14 },
  shadow: { name: 'Shadow Manipulation', emoji: '🌑', kind: 'power', desc: 'Darkness bends to your will.', verbs: ['wrapped in shadows', 'dragged into the dark', 'blinded'], fight: 9, stealth: 0.6, escape: 25 },
  sonic: { name: 'Sonic Scream', emoji: '📢', kind: 'power', desc: 'Your scream can shatter steel.', verbs: ['sonic-blasted', 'shattered the armor of', 'deafened'], fight: 10 },
  plant: { name: 'Plant Control', emoji: '🌿', kind: 'power', desc: 'Every root, vine and tree answers your call.', verbs: ['entangled', 'smashed with a giant vine', 'trapped in thorns'], fight: 8, heal: 4 },
  techno: { name: 'Technopathy', emoji: '💾', kind: 'power', desc: 'You can talk to machines and control any technology.', verbs: ['hijacked the tech of', 'turned the robots against', 'hacked the suit of'], fight: 7, money: 30, gadget: 0.5 },
  size: { name: 'Size Shifting', emoji: '📏', kind: 'power', desc: 'You can grow to skyscraper height or shrink to the size of an ant.', verbs: ['stomped on', 'shrank down and ambushed', 'flicked away'], fight: 11, escape: 20 },
  force: { name: 'Force Fields', emoji: '🛡️', kind: 'power', desc: 'You can project unbreakable energy shields.', verbs: ['trapped in a bubble', 'deflected the attacks of', 'shield-bashed'], fight: 7, armor: 0.5 },
  sorcery: { name: 'Sorcery', emoji: '🔮', kind: 'power', desc: 'You wield ancient, mystical magic.', verbs: ['hexed', 'banished', 'turned into a frog'], fight: 13, heal: 4 },
  hydro: { name: 'Hydrokinesis', emoji: '🌊', kind: 'power', desc: 'You can command water — from a glass to a tidal wave.', verbs: ['drenched and swept away', 'crushed with a wave', 'bubbled'], fight: 10 },
  ghost: { name: 'Intangibility', emoji: '👤', kind: 'power', desc: 'You can phase through walls — and bullets pass right through you.', verbs: ['phased through and disarmed', 'pulled through the floor', 'haunted'], fight: 6, armor: 0.5, stealth: 0.7, escape: 70 },
  precog: { name: 'Precognition', emoji: '👁️', kind: 'power', desc: 'You see a few seconds into the future.', verbs: ['predicted every move of', 'dodged every attack of', 'outplayed'], fight: 9, armor: 0.6 },
  energy: { name: 'Energy Blasts', emoji: '☄️', kind: 'power', desc: 'You fire beams of raw energy from your hands and eyes.', verbs: ['eye-beamed', 'blasted', 'vaporized the weapons of'], fight: 14 },

const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const money = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);

function fullName(p) { return `${p.first} ${p.last}`; }
function me() { return { first: G.first, last: G.last }; }
function heShe(g) { return g === 'm' ? 'he' : 'she'; }
function himHer(g) { return g === 'm' ? 'him' : 'her'; }

// ---------- log ----------
function newYearLog() { G.log.push({ age: G.age, lines: [] }); }
function say(text, cls) {
  const y = G.log[G.log.length - 1];
  y.lines.push(cls ? { t: text, c: cls } : { t: text });
}

// Apply a bundle of stat changes. Keys: happy health smarts looks money rep sus heat level control
function fx(o) {
  if (!o) return;
  const st = G.stats;
  if (o.happy) st.happy = clamp(st.happy + o.happy);
  if (o.health) st.health = clamp(st.health + o.health);
  if (o.smarts) st.smarts = clamp(st.smarts + o.smarts);
  if (o.looks) st.looks = clamp(st.looks + o.looks);
  if (o.money) G.money += o.money;
  const s = G.super;
  if (s) {
    if (o.rep) s.rep = clamp(s.rep + o.rep);
    if (o.heat) s.heat = clamp(s.heat + o.heat);
    if (o.level) s.level = clamp(s.level + o.level);
    if (o.control) s.control = clamp(s.control + o.control);
    if (o.sus) addSuspicion(o.sus);
  }
}

// ---------- people ----------
function addPerson(p) {
  p.id = (G.nextId = (G.nextId || 0) + 1);
  p.alive = p.alive !== false;
  p.knows = !!p.knows;
  p.bond = p.bond == null ? rand(40, 80) : p.bond;
  G.people.push(p);
  return p;
}
function randomPerson(gender, minAge, maxAge, role, last) {
  gender = gender || pick(['m', 'f']);
  return {
    first: pick(FIRST_NAMES[gender]), last: last || pick(LAST_NAMES), gender, role,
    age: rand(minAge, maxAge), looks: rand(10, 100),
  };
}
function roleLabel(p) {
  const m = p.gender === 'm';
  switch (p.role) {
    case 'Partner': return m ? 'Boyfriend' : 'Girlfriend';
    case 'Spouse': return m ? 'Husband' : 'Wife';
    case 'Child': return m ? 'Son' : 'Daughter';
    case 'Sibling': return m ? 'Brother' : 'Sister';
    case 'Parent': return m ? 'Father' : 'Mother';
    default: return p.role;
  }
}
function living(role) { return G.people.filter(p => p.alive && (!role || p.role === role)); }
function partner() { return G.people.find(p => p.alive && (p.role === 'Partner' || p.role === 'Spouse')); }
function parentName() {
  const p = living('Parent');
  return p.length ? `your ${roleLabel(p[0]).toLowerCase()}` : 'your guardian';
}

// ---------- life ----------
function newLife(opts = {}) {
  const gender = opts.gender || pick(['m', 'f']);
  const last = (opts.last || '').trim() || pick(LAST_NAMES);
  const first = (opts.first || '').trim() || pick(FIRST_NAMES[gender]);
  G = {
    v: 1, alive: true, first, last, gender, city: opts.city || pick(CITIES), age: 0,
    stats: { happy: rand(60, 100), health: rand(75, 100), smarts: rand(10, 90), looks: rand(10, 100) },
    money: 0, debt: 0,
    edu: { level: 0, stage: '', years: 0, dropped: false },
    job: null, retiredJob: false, pension: 0,
    people: [], nextId: 0, used: {}, log: [], flags: {},
    originAge: rand(5, 17), super: null, prison: 0, cause: null,
  };
  const wealth = pick([0.5, 1, 1, 1, 2, 4]);
  G.familyWealth = wealth;
  const mom = addPerson({ ...randomPerson('f', 22, 40, 'Parent', last), bond: rand(60, 100) });
  const dad = addPerson({ ...randomPerson('m', 22, 42, 'Parent', last), bond: rand(50, 100) });
  const sibs = rand(0, 2);
  for (let i = 0; i < sibs; i++) addPerson({ ...randomPerson(null, 1, 9, 'Sibling', last), bond: rand(40, 90) });

  newYearLog();
  say(`You were born a ${gender === 'm' ? 'boy' : 'girl'} in ${G.city}, a city where people whisper about masked vigilantes on the rooftops.`);
  say(`Your name is ${first} ${last}.`);
  say(`Your mother is ${fullName(mom)}, age ${mom.age}. Your father is ${fullName(dad)}, age ${dad.age}.`);
  living('Sibling').forEach(s => say(`You have an older ${roleLabel(s).toLowerCase()}, ${s.first}, age ${s.age}.`));
  if (wealth >= 2) say('Your family is wealthy.');
  else if (wealth < 1) say('Your family doesn’t have much money.');
  save();
}

function ageUp() {
  if (!G || !G.alive || isModalOpen()) return;
  G.age++;
  G.used = {};
  G.jobOffers = null;
  G.lastInjury = null;
  newYearLog();

  yearlyStats();
  peopleTick();
  if (G.prison > 0) prisonTick(); else { schoolTick(); jobTick(); }
  moneyTick();
  if (G.super) superYearly();

  if (naturalDeath()) return;

  if (!G.super && G.age === G.originAge && G.prison === 0) {
    triggerOrigin();
  } else {
    if (!G.super && G.age >= 3 && chance(0.25)) say(pick(HINTS), 'hint');
    runYearEvents();
  }
  render();
  save();
}

function yearlyStats() {
  const st = G.stats;
  st.happy = clamp(st.happy + rand(-4, 3));
  if (G.age > 40) st.health = clamp(st.health - rand(0, Math.ceil((G.age - 35) / 10)));
  if (G.age > 30 && chance(0.5)) st.looks = clamp(st.looks - 1);
  if (G.age < 18 && chance(0.3)) st.looks = clamp(st.looks + rand(-2, 3));
  if (G.super && pw('heal')) st.health = clamp(st.health + pw('heal'));
}

function peopleTick() {
  G.people.forEach(p => {
    if (!p.alive) return;
    p.age++;
    p.bond = clamp(p.bond - rand(0, 3));
    let risk = p.age < 60 ? 0.002 : 0.01 + (p.age - 60) * 0.008;
    if (risk > 0 && chance(risk)) {
      p.alive = false;
      say(`💔 Your ${roleLabel(p).toLowerCase()}, ${fullName(p)}, died at age ${p.age}.`, 'bad');
      fx({ happy: p.bond > 40 ? -rand(10, 25) : -rand(0, 5) });
    }
  });
}

function schoolTick() {
  const e = G.edu, st = G.stats;
  if (!e.dropped) {
    if (G.age === 5) { e.stage = 'Elementary School'; say('🎒 You started elementary school.'); }
    if (G.age === 11) { e.stage = 'Middle School'; say('🏫 You started middle school.'); }
    if (G.age === 14) { e.stage = 'High School'; say('🏫 You started high school.'); }
  }
  if (['Elementary School', 'Middle School', 'High School'].includes(e.stage)) st.smarts = clamp(st.smarts + rand(0, 3));
  if (G.age === 18 && e.stage === 'High School') {
    e.stage = '';
    e.level = Math.max(e.level, 1);
    say('🎓 You graduated from high school!', 'good');
    fx({ happy: 8 });
    collegePrompt();
  }
  if (e.stage === 'University') {
    e.years++; st.smarts = clamp(st.smarts + rand(1, 4));
    if (e.years >= 4) { e.stage = ''; e.level = 2; say('🎓 You graduated from university with a bachelor’s degree!', 'good'); fx({ happy: 10 }); }
  } else if (e.stage === 'Graduate School') {
    e.years++; st.smarts = clamp(st.smarts + rand(1, 4));
    if (e.years >= 3) { e.stage = ''; e.level = 3; say('🎓 You earned your graduate degree!', 'good'); fx({ happy: 10 }); }
  }
}

function collegePrompt() {
  popup({
    emoji: '🎓', title: 'What’s Next?',
    text: 'You graduated from high school! Do you want to go to university?',
    choices: [
      { label: 'Enroll (student loans: $40,000)', fn: () => enrollUni(true) },
      { label: 'Ask your parents to pay', show: () => living('Parent').length > 0, fn: () => {
        const p = living('Parent').sort((a, b) => b.bond - a.bond)[0];
        if (chance(0.25 * G.familyWealth + p.bond / 300)) {
          say(`Your ${roleLabel(p).toLowerCase()} agreed to pay for your tuition!`, 'good');
          enrollUni(false);
        } else {
          result('😬', 'No Luck', `Your ${roleLabel(p).toLowerCase()} said they can’t afford it. You took out student loans instead.`);
          enrollUni(true);
        }
      } },
      { label: 'Skip college', fn: () => say('You decided not to go to college.') },
    ],
  });
}
function enrollUni(loan) {
  G.edu.stage = 'University'; G.edu.years = 0;
  if (loan) G.debt += 40000;
  say('🏛️ You enrolled at Valor State University.');
}

function jobTick() {
  const j = G.job;
  if (!j) return;
  j.years++;
  j.perf = clamp(j.perf + rand(-8, 6));
  if (j.perf >= 70 && j.years >= 2 && j.rank < RANKS.length - 1 && !j.pt && chance(0.35)) {
    j.rank++; j.salary = Math.round(j.salary * (1.12 + Math.random() * 0.1));
    say(`📈 You were promoted to ${jobTitle(j)}! Your new salary is ${money(j.salary)}.`, 'good');
    fx({ happy: 8 });
  } else if (j.perf < 20 && chance(0.4)) {
    say(`📉 You were fired from your job as a ${jobTitle(j)}.`, 'bad');
    G.job = null; fx({ happy: -15 });
  }
}
function jobTitle(j) { return RANKS[j.rank || 0] + j.t; }

function moneyTick() {
  if (G.job && G.prison === 0) G.money += Math.round(G.job.salary * (G.job.pt ? 0.9 : 0.65));
  if (G.pension) G.money += G.pension;
  if (G.super && G.super.agency && !G.super.retired && G.prison === 0) G.money += 90000;
  if (G.debt > 0 && G.money > 0) {
    const pay = Math.min(G.debt, Math.max(3000, Math.round(G.money * 0.2)), G.money);
    G.debt -= pay; G.money -= pay;
    if (G.debt === 0) say('🎉 You paid off all of your debt!', 'good');
  }
  // Adults without income slowly burn money on living costs.
  if (G.age >= 18 && G.prison === 0 && !G.job && !G.edu.stage && G.money > 0) G.money -= Math.min(G.money, 8000);
}

function prisonTick() {
  G.prison--;
  fx({ happy: -rand(3, 8), health: -rand(0, 3) });
  if (G.prison <= 0) {
    G.prison = 0;
    say('🔓 You were released from prison!', 'good');
    fx({ happy: 15 });
  } else say(`⛓️ You are in prison. ${G.prison} year${G.prison === 1 ? '' : 's'} left.`);
}

function naturalDeath() {
  let risk = 0;
  if (G.age > 55) risk = Math.pow((G.age - 55) / 50, 2.2);
  if (G.super && pw('heal')) risk *= 0.4;
  const sick = G.stats.health < 20 ? 0.08 : 0;
  if (G.stats.health <= 0 || chance(sick)) { die(G.lastInjury || 'poor health'); return true; }
  if (chance(risk)) { die('old age'); return true; }
  return false;
}

function die(cause) {
  if (!G.alive) return;
  G.alive = false;
  G.cause = cause;
  say(`☠️ You died at age ${G.age} from ${cause}.`, 'bad');
  save();
  showDeath();
}

// After each popup chain, check whether something killed us.
function checkDeath() {
  if (G && G.alive && G.stats.health <= 0) die(G.lastInjury || 'poor health');
}

// ---------- activities ----------
function once(key) {
  if (G.used[key]) { toast('You already did that this year.'); return false; }
  G.used[key] = true;
  return true;
}

function result(emoji, title, text) {
  popup({ emoji, title, text, choices: [{ label: 'OK' }] });
}

// ---------- persistence ----------
function save() {
  try { if (G) localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { /* storage unavailable */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    G = JSON.parse(raw);
    return !!(G && G.alive);
  } catch (e) { return false; }
}
function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
}

// Superpowers: origin story, secret identity, missions, nemesis, teams, arrests.

function pw(field, def = 0) {
  if (!G.super) return def;
  const a = POWERS[G.super.power][field];
  const b = G.super.second ? POWERS[G.super.second][field] : undefined;
  if (typeof a === 'number' && typeof b === 'number') {
    // multipliers (<1) take the best, bonuses add
    return (field === 'stealth' || field === 'armor' || field === 'gadget') ? Math.min(a, b) : a + Math.round(b / 2);
  }
  return a ?? b ?? def;
}
function isHero() { return G.super && G.super.alignment === 'hero'; }
function alias() { return G.super ? G.super.alias : ''; }
function repWord() { return isHero() ? 'Fame' : 'Infamy'; }
function tierName(l) { return l >= 95 ? 'Omega-Level' : l >= 75 ? 'Legendary' : l >= 50 ? 'Elite' : l >= 25 ? 'Adept' : 'Novice'; }
function maxEnergy() { return 3 + pw('energy', 0); }
function gadgetBonus() { return G.super.gadgets.reduce((t, id) => t + GADGETS.find(g => g.id === id).bonus, 0); }
function baseBonus() { return G.super.base >= 0 ? BASES[G.super.base].bonus : 0; }
function teamBonus() { return G.super.team ? G.super.team.bonus : 0; }
function priceMult() { return pw('gadget', 1); }

// Overall combat strength. Starts ~30, tops out ~150.
function combatScore() {
  const s = G.super;
  return s.level + pw('fight') + gadgetBonus() + baseBonus() + teamBonus() + (s.sidekick ? 4 : 0) + G.stats.health / 10;
}
function winChance(diff) { return clamp((combatScore() * 1.2 + 40 - diff) / 100, 0.05, 0.95); }

function injure(min, max, cause) {
  const s = G.super;
  let mult = pw('armor', 1);
  if (s && COSTUMES[s.costume].armor) mult *= COSTUMES[s.costume].armor;
  const dmg = Math.round(rand(min, max) * mult);
  G.stats.health = clamp(G.stats.health - dmg);
  G.lastInjury = cause || 'injuries sustained in battle';
  return dmg;
}

function spendEnergy() {
  const s = G.super;
  if (s.energy <= 0) { toast('You’re exhausted. Age up to recover your energy.'); return false; }
  s.energy--;
  return true;
}

// ---------- origin ----------
function originContext() {
  const school = G.edu.stage ? `your ${G.edu.stage.toLowerCase()}` : 'school';
  return { name: G.first, age: G.age, city: G.city, school, parent: parentName() };
}

function triggerOrigin() {
  const o = pick(ORIGINS);
  const c = originContext();
  say(`⚡ Something happened this year that changed your life forever…`, 'super');
  popup({
    emoji: o.emoji, title: o.title, cls: 'origin', text: o.text(c),
    choices: o.choices.map(ch => ({ label: ch.label, fn: () => originChoice(o, ch) })),
  });
}

function originChoice(o, ch) {
  fx(ch.fx);
  const powerId = pick(ch.powers);
  const p = POWERS[powerId];
  G.super = {
    origin: o.title, originAge: G.age, power: powerId, second: null,
    level: clamp(rand(5, 15) + (ch.tier || 0), 1, 40), control: rand(10, 30),
    alignment: null, alias: '', color: null, costume: 0, gadgets: [], base: -1,
    rep: 0, heat: 0, suspicion: 0, exposed: false, registered: null,
    team: null, sidekick: null, nemesis: null, agency: false, retired: false,
    energy: 0, doomsday: 0, ruler: false, savedWorld: false,
    stats: { missions: 0, saved: 0, defeated: 0, crimes: 0, stolen: 0, losses: 0 },
    lean: ch.lean || null,
  };
  if (p.smarts) fx({ smarts: p.smarts });
  if (p.looks) fx({ looks: p.looks });
  G.super.energy = maxEnergy();
  say(`${o.emoji} ${o.title}: ${ch.result}`, 'super');
  say(`${p.emoji} You gained ${p.kind === 'skill' ? 'the skill' : 'the power of'} ${p.name}!`, 'super');
  popup({
    emoji: p.emoji, title: p.kind === 'skill' ? 'A Legend Is Born' : 'Your Powers Awaken!', cls: 'origin',
    text: `${ch.result}<br><br>You now have <b>${p.name}</b>.<br><i>${p.desc}</i>`,
    choices: [{ label: 'Embrace your destiny', fn: chooseAlignment }],
  });
}

function chooseAlignment() {
  const lean = G.super.lean;
  const leanText = lean === 'hero' ? 'Deep down, you feel a pull toward protecting people.'
    : lean === 'villain' ? 'Deep down, a dark voice whispers that you deserve more than this.'
      : 'Your heart is torn.';
  popup({
    emoji: '⚖️', title: 'Hero or Villain?', cls: 'origin',
    text: `With great power comes a big decision. ${leanText}<br><br>Who will you become?`,
    choices: [
      { label: '🦸 Become a Hero', cls: 'hero', fn: () => { G.super.alignment = 'hero'; chooseAlias(); } },
      { label: '🦹 Become a Villain', cls: 'villain', fn: () => { G.super.alignment = 'villain'; chooseAlias(); } },
    ],
  });
}

function suggestAliases(powerId, alignment, gender) {
  const theme = ALIAS.theme[powerId] || ALIAS.heroWords;
  const g = gender === 'm' ? 'm' : 'f';
  const hero = alignment === 'hero';
  const pre = hero ? ALIAS.heroPre[g] : ALIAS.villPre[g];
  const words = hero ? ALIAS.heroWords : ALIAS.villWords;
  const youth = G.age < 18 ? (g === 'm' ? 'boy' : 'girl') : null;
  const out = new Set();
  let guard = 0;
  while (out.size < 6 && guard++ < 60) {
    const t = pick(theme);
    switch (rand(0, 4)) {
      case 0: out.add(`${pick(pre)} ${t}`); break;
      case 1: out.add(t); break;
      case 2: out.add(`The ${t}`); break;
      case 3: out.add(`${pick(pre)} ${pick(words)}`); break;
      default: {
        if (!hero) { out.add(`${t} ${pick(words)}`); break; }
        const suf = youth && chance(0.5) ? youth : pick(ALIAS.heroSuf[g]);
        out.add(t.includes(' ') ? `${t} ${suf[0].toUpperCase()}${suf.slice(1)}` : `${t}${suf === 'Knight' ? ' Knight' : suf}`);
      }
    }
  }
  return [...out];
}

function chooseAlias() {
  const s = G.super;
  popup({
    emoji: s.alignment === 'hero' ? '🦸' : '🦹', title: 'Choose Your Name', cls: 'origin',
    text: `Every ${s.alignment} needs a name the world will remember. Type your own or tap a suggestion.`,
    input: { placeholder: 'Your super name', suggestions: suggestAliases(s.power, s.alignment, G.gender), max: 28 },
    choices: [{ label: 'That’s my name', fn: name => { s.alias = name || suggestAliases(s.power, s.alignment, G.gender)[0]; chooseColor(); } }],
  });
}

function chooseColor() {
  popup({
    emoji: '🎨', title: 'Design Your Costume', cls: 'origin',
    text: `What colors will <b>${esc(alias())}</b> wear? (You’re starting with a homemade costume — upgrade it later.)`,
    choices: COSTUME_COLORS.map(c => ({ label: `${c.emoji} ${c.name}`, fn: () => { G.super.color = c.name; finishOrigin(); } })),
    grid: true,
  });
}

function finishOrigin() {
  const s = G.super;
  const p = POWERS[s.power];
  const hero = s.alignment === 'hero';
  say(`${hero ? '🦸' : '🦹'} You became the ${hero ? 'superhero' : 'supervillain'} <b>${esc(s.alias)}</b>, wearing ${s.color}. Nobody knows that ${esc(s.alias)} is really ${esc(G.first)} ${esc(G.last)}.`, 'super');
  popup({
    emoji: hero ? '🦸' : '🦹', title: s.alias, cls: 'origin',
    text: `${hero ? 'A new hero rises' : 'A new villain emerges'} in ${G.city}!<br><br>
      ${p.emoji} <b>${p.name}</b> · ${tierName(s.level)} (power ${s.level})<br>
      🎭 Secret identity: <b>${esc(G.first)} ${esc(G.last)}</b><br><br>
      Open the <b>⚡ Powers</b> tab to ${hero ? 'patrol the city, fight villains and protect your secret identity' : 'plan heists, battle heroes and stay one step ahead of the law'}.
      Every mission raises <b>Suspicion</b> — if it hits 100%, the world learns who you are.`,
    choices: [{ label: hero ? 'Up, up and away!' : 'Muahahaha!' }],
  });
}

// ---------- secret identity ----------
function addSuspicion(n) {
  const s = G.super;
  if (!s || s.exposed || n === 0) return;
  if (n > 0) n = Math.round(n * COSTUMES[s.costume].mult * pw('stealth', 1));
  s.suspicion = clamp(s.suspicion + n);
  if (s.suspicion >= 100) exposeIdentity('The press connected the dots.');
}

function exposeIdentity(how) {
  const s = G.super;
  if (s.exposed) return;
  s.exposed = true; s.suspicion = 100;
  G.people.forEach(p => { p.knows = true; });
  const hero = isHero();
  say(`📰 EXPOSED! The whole world now knows that ${esc(s.alias)} is ${esc(G.first)} ${esc(G.last)}.`, 'bad');
  let extra = '';
  if (hero) {
    fx({ rep: 10, happy: -10 });
    extra = 'Fans swarm your house. Reporters camp on your lawn. And every villain now knows where your family lives.';
  } else {
    fx({ heat: 40, happy: -10 });
    extra = 'Your face is on every wanted poster in the country.';
    if (G.job) { say(`You were fired from your job as a ${jobTitle(G.job)}.`, 'bad'); G.job = null; extra += ' Your boss fired you on live TV.'; }
  }
  popup({ emoji: '📰', title: 'Identity Exposed!', text: `${how}<br><br>The headline reads: <b>“${esc(s.alias.toUpperCase())} UNMASKED: IT’S ${esc(G.first.toUpperCase())} ${esc(G.last.toUpperCase())}!”</b><br><br>${extra}`, choices: [{ label: 'Uh oh.' }] });
}

// ---------- yearly ----------
function superYearly() {
  const s = G.super;
  s.energy = maxEnergy();
  if (s.retired) return;
  if (!s.exposed) s.suspicion = clamp(s.suspicion - rand(2, 6));
  s.heat = clamp(s.heat - rand(3, 8));
  if (!s.activeLastYear && s.rep > 10) s.rep = clamp(s.rep - rand(1, 4));
  s.activeLastYear = false;
  s.control = clamp(s.control + rand(0, 2));
  if (s.team && G.prison === 0) G.money += s.team.pay;
  if (s.sidekick && !isHero()) {
    const cost = 20000;
    if (G.money >= cost) G.money -= cost;
    else { say(`Your henchman ${s.sidekick.name} quit because you couldn’t pay them.`, 'bad'); s.sidekick = null; }
  }
  const n = s.nemesis;
  if (n && n.alive) {
    n.level = clamp(n.level + rand(1, 4), 1, 120);
    if (n.jailed > 0 && --n.jailed === 0) say(`🚨 Your nemesis ${n.name} has escaped from prison!`, 'bad');
  }
  // Wanted villains (and rogue vigilantes) get hunted down.
  if (G.prison === 0 && s.heat >= 40 && chance((s.heat - 20) / 200)) arrestEvent();
}

function markActive() { G.super.activeLastYear = true; G.super.stats.missions++; }

// ---------- nemesis ----------
function makeNemesis() {
  const s = G.super;
  const hero = isHero();
  const powerId = pick(Object.keys(POWERS).filter(k => k !== s.power));
  s.nemesis = {
    name: pick(hero ? NPC_VILLAINS : NPC_HEROES), power: powerId, alignment: hero ? 'villain' : 'hero',
    level: clamp(s.level + rand(0, 12), 10, 100), wins: 0, losses: 0, alive: true, jailed: 0,
  };
  return s.nemesis;
}
function nemesisAvailable() { const n = G.super.nemesis; return n && n.alive && !n.jailed; }

function fightNemesis(context) {
  const s = G.super, n = s.nemesis;
  const np = POWERS[n.power];
  const p = chance(winChance(n.level + 30));
  markActive();
  if (p) {
    n.losses++;
    fx({ rep: rand(6, 12), happy: 10, control: 2, level: rand(1, 3) });
    say(`⚔️ You ${pick(POWERS[s.power].verbs)} your nemesis ${n.name} and won the battle!`, 'good');
    const choices = isHero()
      ? [
        { label: 'Hand them over to the authorities', fn: () => { n.jailed = rand(3, 8); s.stats.defeated++; fx({ rep: 5 }); say(`${n.name} was locked up in Blackgate Maximum Security.`); } },
        { label: 'Let them go', fn: () => { fx({ rep: -3 }); say(`You let ${n.name} escape. They swore they’d be back.`); } },
      ]
      : [
        { label: 'Finish them for good', fn: () => { n.alive = false; s.stats.defeated++; fx({ rep: 15, heat: 25, happy: 5 }); say(`💀 You destroyed your nemesis ${n.name}. The world mourns its fallen hero.`, 'bad'); } },
        { label: 'Humiliate them on live TV', fn: () => { fx({ rep: 10, heat: 10 }); say(`You broadcast ${n.name}’s defeat to the whole world.`); } },
        { label: 'Leave them beaten', fn: () => { say(`You left ${n.name} beaten in the rubble.`); } },
      ];
    popup({ emoji: '🏆', title: 'Victory!', text: `${context || ''}You ${pick(POWERS[s.power].verbs)} <b>${n.name}</b>! Their ${np.name.toLowerCase()} was no match for you.<br><br>What now?`, choices });
  } else {
    n.wins++;
    const dmg = injure(12, 35, `a battle with ${n.name}`);
    fx({ rep: -rand(3, 8), happy: -10, sus: 6 });
    say(`💥 Your nemesis ${n.name} defeated you in battle. (-${dmg} health)`, 'bad');
    result('💥', 'Defeated', `${context || ''}<b>${n.name}</b> used ${np.name.toLowerCase()} to beat you badly. You barely escaped with your life. (-${dmg} health)`);
  }
}

// ---------- actions (called from the Powers panel) ----------
function actTrain() {
  if (!spendEnergy()) return;
  const s = G.super;
  const gain = Math.max(1, Math.round(rand(2, 6) * (s.level < 50 ? 1 : s.level < 80 ? 0.6 : 0.35)));
  s.level = clamp(s.level + gain);
  s.control = clamp(s.control + rand(3, 8));
  fx({ health: rand(0, 3) });
  if (s.control < 35 && chance(0.25)) {
    const dmg = injure(5, 15, 'a training accident');
    fx({ sus: 12 });
    say(`💥 You lost control while training and wrecked a city block! (-${dmg} health)`, 'bad');
    result('💥', 'Out of Control!', `Your ${POWERS[s.power].name.toLowerCase()} surged out of control during training. Half a city block is in ruins and the news is asking questions. (-${dmg} health, +suspicion)`);
  } else {
    say(`🏋️ You trained your ${POWERS[s.power].name.toLowerCase()}. (+${gain} power)`);

function actPatrol() {

function actCrime() {

function doCrime(c) {
  if (!spendEnergy()) return;
  const s = G.super;
  markActive();
  if (chance(winChance(c.d))) {
    const cash = Math.round(rand(c.cash[0], c.cash[1]) * (1 + pw('money') / 100) * (1 + s.level / 200));
    G.money += cash;
    s.stats.crimes++; s.stats.stolen += cash;
    fx({ rep: c.inf, heat: c.heat, happy: rand(5, 10), sus: rand(3, 7) });

    result(c.emoji, 'Crime Pays', `${c.t} — success! You ${pick(POWERS[s.power].verbs)} the guards and escaped with <b>${money(cash)}</b>.`);

      const n = makeNemesis();
      say(`🦸 A hero calling themselves ${n.name} has sworn to stop you. You have a nemesis.`, 'bad');

function actBuyCostume() {

  const next = COSTUMES[s.costume + 1];
  if (!next) return;
  const cost = Math.round(next.cost * priceMult());
  if (G.money < cost) return toast(`You need ${money(cost)}.`);
  G.money -= cost; s.costume++;
  say(`🎭 You upgraded to a ${next.name}.`);
  toast(`New costume: ${next.name}`);
}

function actBuyGadget(g) {
  const s = G.super;
  const cost = Math.round(g.cost * priceMult());
  if (s.gadgets.includes(g.id)) return;
  if (G.money < cost) return toast(`You need ${money(cost)}.`);
  G.money -= cost; s.gadgets.push(g.id);
  say(`${g.emoji} You ${pw('gadget', 1) < 1 ? 'built' : 'bought'} a ${g.name}.`);
  toast(`Got: ${g.name}`);
}

function actBuyBase() {
  const s = G.super;
  const next = BASES[s.base + 1];
  if (!next) return;
  const cost = Math.round(next.cost * priceMult());
  if (G.money < cost) return toast(`You need ${money(cost)}.`);
  G.money -= cost; s.base++;
  say(`🏰 You set up your new base: the ${next.name[s.alignment]}.`, 'good');
  toast(`New base: ${next.name[s.alignment]}`);
}

function actJoinTeam(t) {
  const s = G.super;
  if (s.rep < t.rep) return toast(`You need ${t.rep} ${repWord().toLowerCase()}.`);
  if (!once('team')) return;
  if (chance(0.55 + (s.rep - t.rep) / 80)) {
    s.team = { ...t };
    fx({ happy: 10 });
    say(`🤝 You joined ${t.name}!`, 'good');
    result('🤝', 'Welcome to the Team', `<b>${t.name}</b> welcomed you as a member. You’ll get backup on missions and a yearly cut of ${money(t.pay)}.`);
  } else {
    result('🙅', 'Rejected', `${t.name} turned you down. Build your reputation and try again next year.`);
  }
}

function actRecruit() {
  const s = G.super;
  if (!once('recruit')) return;
  const p = randomPerson(null, 14, 25, 'Ally');
  const nick = isHero() ? `Kid ${pick(ALIAS.theme[s.power] || ALIAS.heroWords)}` : pick(['Knuckles', 'Tiny', 'Scratch', 'Lefty', 'Bones', 'Sparky', 'Mugsy']);
  if (s.rep >= 25 && chance(0.6)) {
    s.sidekick = { name: `${nick}`, real: fullName(p) };
    say(`🫡 ${p.first} joined you as your ${isHero() ? 'sidekick' : 'henchman'}, “${nick}.”`, 'good');
    result('🫡', isHero() ? 'New Sidekick' : 'New Henchman', `<b>${esc(p.first)}</b> wants to fight by your side as <b>${nick}</b>.${isHero() ? '' : ' They’ll cost $20,000 a year.'}`);
  } else result('🤷', 'No Takers', 'Nobody wanted the job this year. Raise your reputation and try again.');
}

function actRevealIdentity() {

    emoji: '🎭', title: 'Unmask Yourself?',
    text: `Do you want to tell the world that ${esc(alias())} is really ${esc(G.first)} ${esc(G.last)}? There’s no going back.`,
    choices: [
      { label: 'Unmask on live TV', fn: () => exposeIdentity(`You stood in front of the cameras and pulled off your mask.`) },
      { label: 'Keep the secret' },
    ],
  });
}

function actSwitchSides() {
  const s = G.super;
  const toHero = !isHero();
  popup({
    emoji: toHero ? '🕊️' : '😈', title: toHero ? 'Redemption' : 'Fall From Grace',
    text: toHero ? 'Can a villain really change? You’ll lose your criminal friends — and the heroes may never fully trust you.' : 'The heroes will call you a traitor. But being bad pays a lot better…',

function switchSides() {
  const s = G.super;
  s.alignment = s.alignment === 'hero' ? 'villain' : 'hero';
  s.rep = Math.round(s.rep / 3);
  s.team = null; s.agency = false;
  if (s.nemesis) { say(`Your old nemesis ${s.nemesis.name} can’t believe you switched sides.`); s.nemesis = null; }
  say(s.alignment === 'hero' ? `🕊️ ${esc(s.alias)} turned their back on crime and became a hero.` : `😈 ${esc(s.alias)} turned their back on justice and became a villain.`, 'super');
}

function actRetire() {
  const s = G.super;
  if (s.retired) {
    s.retired = false;
    say(`🦸 ${esc(s.alias)} came out of retirement!`, 'super');
    return toast('You’re back!');
  }
  popup({
    emoji: '🧥', title: 'Hang Up the Cape?', text: 'Retiring means no more missions, no more nemesis attacks — and maybe a quiet life.',
    choices: [
      { label: 'Retire', fn: () => { s.retired = true; s.team = null; s.agency = false; fx({ happy: 5 }); say(`🧥 ${esc(s.alias)} retired from the ${isHero() ? 'hero' : 'villain'} life.`); } },
      { label: 'Not yet' },
    ],
  });
}

// ---------- capture & prison ----------
function arrestEvent() {
  const s = G.super;
  const hero = isHero();
  const bribe = 50000 * Math.ceil(s.heat / 20);
  popup({
    emoji: '🚨', title: 'Surrounded!',
    text: hero
      ? `The Metahuman Response Unit has you surrounded. You’re wanted for illegal vigilante activity.`
      : `SWAT teams and the Metahuman Response Unit have tracked you down. Spotlights. Helicopters. Power-dampening cuffs. “${esc(s.alias)}, come out with your hands up!”`,
    choices: [
      { label: 'Surrender', fn: () => goToPrison(Math.max(1, Math.round(2 + s.heat / 12)), 'You surrendered peacefully.') },
      { label: 'Fight your way out', fn: () => {
        if (chance(winChance(55))) { fx({ heat: 10, rep: 5 }); say('💥 You fought off an entire police squad and escaped!', 'good'); result('💥', 'Escaped!', 'You smashed through the police line and vanished into the night. (+heat)'); }
        else { const dmg = injure(15, 30, 'a battle with police'); if (G.stats.health > 0) goToPrison(Math.round(4 + s.heat / 8), `You fought hard but they overwhelmed you. (-${dmg} health)`); }
      } },
      { label: 'Escape with your powers', show: () => pw('escape') > 0, fn: () => {
        if (chance(0.25 + pw('escape') / 100)) { fx({ heat: -10 }); say('🌀 You used your powers to slip away from the police.', 'good'); result('🌀', 'Gone!', 'One second you were there, the next you were gone. The cops are baffled.'); }
        else goToPrison(Math.round(3 + s.heat / 10), 'Your escape failed — they were ready for your powers.');
      } },
      { label: `Bribe them (${money(bribe)})`, show: () => G.money >= bribe, fn: () => { G.money -= bribe; s.heat = clamp(s.heat - 30); say(`💰 You bribed your way out of an arrest for ${money(bribe)}.`); } },
    ],
  });
}

function goToPrison(years, why) {
  const s = G.super;
  G.prison = years;
  if (G.job) { say(`You lost your job as a ${jobTitle(G.job)}.`, 'bad'); G.job = null; }
  if (G.edu.stage === 'University' || G.edu.stage === 'Graduate School') G.edu.stage = '';
  if (s) {
    s.heat = 0; s.team = null;
    if (!s.exposed) exposeIdentity('When the police pulled off your mask in custody, the cameras were rolling.');
  }
  say(`⛓️ You were sentenced to ${years} years in Blackgate Maximum Security Prison.`, 'bad');
  result('⛓️', 'Sentenced', `${why}<br><br>You were sentenced to <b>${years} years</b> in Blackgate Maximum Security Prison.`);
}

function actBreakOut() {
  if (!once('breakout')) return;
  const bonus = G.super ? pw('escape') / 100 + G.super.level / 300 : 0;
  if (chance(0.08 + bonus)) {
    G.prison = 0;
    if (G.super) fx({ heat: 40, rep: 6 });
    say('🔓 You broke out of prison!', 'good');
    result('🔓', 'Jailbreak!', 'You broke out of Blackgate in the middle of the night. You’re free — but every cop in the country is looking for you.');
  } else {
    G.prison += 2;
    injure(5, 15, 'a failed prison break');
    say('🚨 Your escape attempt failed. Two years were added to your sentence.', 'bad');
    result('🚨', 'Caught', 'The guards caught you halfway over the wall. +2 years to your sentence.');
  }
}

function eligible(list, ageCheck) {
  return list.filter(e => (!ageCheck || (G.age >= e.min && G.age <= e.max))
    && !(e.once && G.flags['ev_' + e.id])
    && (!e.cond || e.cond()));
}
function weightedPick(list) {
  const total = list.reduce((t, e) => t + (e.w || 1), 0);
  let r = Math.random() * total;
  for (const e of list) { r -= (e.w || 1); if (r <= 0) return e; }
  return list[list.length - 1];
}
function fireEvent(e) {
  if (e.once) G.flags['ev_' + e.id] = true;
  e.fire();
}

function runYearEvents() {
  if (G.prison > 0) {
    if (chance(0.3)) {
      const d = rand(5, 15);
      popup({ emoji: '⛓️', title: 'Prison Yard', text: 'A gang of inmates surrounds you in the yard.', choices: [
        { label: 'Fight', fn: () => { if (chance(G.super ? winChance(25) : 0.4)) { fx({ happy: 5 }); say('You won a prison yard fight. Nobody messes with you now.', 'good'); } else { fx({ health: -d }); G.lastInjury = 'a prison fight'; say(`You lost a prison yard fight. (-${d} health)`, 'bad'); } } },
        { label: 'Back down', fn: () => { fx({ happy: -6 }); say('You backed down in the prison yard.'); } },
      ] });
    }
    return;
  }
  const life = eligible(LIFE_EVENTS, true);
  if (life.length && chance(0.65)) {
    const e = weightedPick(life);
    fireEvent(e);
    const rest = life.filter(x => x !== e);
    if (rest.length && chance(0.15)) fireEvent(weightedPick(rest));
  }
  if (G.super && !G.super.retired) {
    const sup = eligible(SUPER_EVENTS, false);
    if (sup.length && chance(0.6)) fireEvent(weightedPick(sup));
  }
}

// Rendering, panels, popups, start & death screens.

const $ = sel => document.querySelector(sel);
let currentSheet = null;

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(k => { if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k)); });
  return e;
}

// ---------- popups ----------
const Q = [];
let current = null;
function isModalOpen() { return !!current; }
function popup(spec) { Q.push(spec); if (!current) nextModal(); }

function nextModal() {
  const root = $('#modal');
  if (!G || !G.alive) Q.length = 0;
  if (!Q.length) {
    current = null;
    root.hidden = true;
    checkDeath();
    render();
    save();
    return;
  }
  current = Q.shift();
  const spec = current;
  const choices = (spec.choices && spec.choices.length ? spec.choices : [{ label: 'OK' }]).filter(c => !c.show || c.show());
  let input = null;
  const card = h('div', { class: `card ${spec.cls || ''}` },
    spec.emoji ? h('div', { class: 'card-emoji' }, spec.emoji) : null,
    h('h2', {}, spec.title || ''),
    h('div', { class: 'card-text', html: spec.text || '' }),
  );
  if (spec.input) {
    input = h('input', { type: 'text', class: 'name-input', placeholder: spec.input.placeholder || '', maxlength: spec.input.max || 30 });
    card.append(input);
    if (spec.input.suggestions) {
      card.append(h('div', { class: 'chips' }, spec.input.suggestions.map(s => h('button', { class: 'chip', onclick: () => { input.value = s; } }, s))));
    }
  }
  card.append(h('div', { class: `choices ${spec.grid ? 'grid' : ''}` }, choices.map(c =>
    h('button', { class: `choice ${c.cls || ''}`, onclick: () => choose(c, input ? input.value.trim() : undefined) },
      c.label, c.hint ? h('small', {}, c.hint) : null))));
  root.replaceChildren(card);
  root.hidden = false;
  if (input) setTimeout(() => input.focus(), 50);
}

function choose(c, value) {
  const pending = Q.splice(0);
  if (c.fn) c.fn(value);
  Q.push(...pending);
  nextModal();
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  render();
  save();
}

// ---------- main render ----------
function occupation() {
  if (G.prison > 0) return 'Prison Inmate';
  if (G.job) return jobTitle(G.job);
  if (G.edu.stage) return G.edu.stage === 'University' || G.edu.stage === 'Graduate School' ? `${G.edu.stage} Student` : 'Student';
  if (G.age < 5) return G.age < 2 ? 'Baby' : 'Toddler';
  if (G.retiredJob) return 'Retired';
  return 'Unemployed';
}
function avatar() {
  const m = G.gender === 'm';
  if (G.age < 3) return '👶';
  if (G.age < 13) return m ? '👦' : '👧';
  if (G.age < 60) return m ? '👨' : '👩';
  return m ? '👴' : '👵';
}

function render() {
  if (!G) return;
  const s = G.super;
  $('#avatar').textContent = avatar();
  $('#name').textContent = `${G.first} ${G.last}`;
  $('#sub').innerHTML = `Age ${G.age} · ${esc(occupation())}` + (s ? ` · <span class="badge ${s.alignment || ''}">${s.alignment === 'hero' ? '🦸' : '🦹'} ${esc(s.alias || '???')}</span>` : '');
  $('#money').textContent = money(G.money);
  $('#money').classList.toggle('neg', G.money < 0);

  // log
  const log = $('#log');
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.replaceChildren(...G.log.map(y => h('div', { class: 'year' },
    h('div', { class: 'year-age' }, y.age === 0 ? 'Born' : `Age ${y.age}`),
    y.lines.map(l => h('p', { class: l.c || '', html: l.t })))));
  if (atBottom || renderScrollPending) { log.scrollTop = log.scrollHeight; renderScrollPending = false; }

  // stats
  const st = G.stats;
  const bars = [
    ['😊 Happiness', st.happy], ['❤️ Health', st.health], ['🧠 Smarts', st.smarts], ['✨ Looks', st.looks],
  ];
  if (s && s.alignment) {
    bars.push([`⚡ Power`, s.level, 'power']);
    bars.push([s.alignment === 'hero' ? '🌟 Fame' : '💀 Infamy', s.rep, s.alignment]);
    bars.push([s.exposed ? '🎭 EXPOSED' : '🎭 Suspicion', s.suspicion, 'danger']);
    bars.push(['🚨 Wanted', s.heat, 'danger']);
  }
  $('#stats').replaceChildren(...bars.map(([label, v, cls]) => statBar(label, v, cls)));

  // nav
  $('#nav-powers').classList.toggle('locked', !s);
  $('#nav-powers').classList.toggle('glow', !!s && !s.retired && s.energy > 0);
  if (currentSheet) renderSheet();
}
let renderScrollPending = true;

function statBar(label, v, cls) {
  const color = cls === 'danger' ? (v > 70 ? 'var(--bad)' : v > 40 ? 'var(--warn)' : 'var(--ok)')
    : cls ? `var(--${cls})` : v < 25 ? 'var(--bad)' : v < 50 ? 'var(--warn)' : 'var(--ok)';
  return h('div', { class: 'stat' },
    h('span', { class: 'stat-label' }, label),
    h('div', { class: 'bar' }, h('div', { class: 'fill', style: `width:${Math.round(v)}%;background:${color}` })),
    h('span', { class: 'stat-val' }, `${Math.round(v)}%`));
}

// ---------- sheets ----------
function openSheet(name) {
  if (!G || !G.alive) return;
  currentSheet = name;
  $('#sheet').hidden = false;
  renderSheet();
}
function closeSheet() { currentSheet = null; $('#sheet').hidden = true; }

function renderSheet() {
  const titles = { career: '💼 Occupation', people: '❤️ Relationships', activities: '🎯 Activities', powers: '⚡ Powers' };
  const body = { career: careerPanel, people: peoplePanel, activities: activitiesPanel, powers: powersPanel }[currentSheet]();
  const scroller = $('#sheet-body');
  const top = scroller.scrollTop;
  $('#sheet-title').textContent = titles[currentSheet];
  scroller.replaceChildren(body);
  scroller.scrollTop = top;
}

function row(emoji, title, sub, fn, opts = {}) {
  return h('button', { class: `row ${opts.disabled ? 'disabled' : ''} ${opts.cls || ''}`, onclick: opts.disabled ? () => opts.why && toast(opts.why) : fn },
    h('span', { class: 'row-emoji' }, emoji),
    h('span', { class: 'row-main' }, h('b', {}, title), sub ? h('small', { html: sub }) : null),
    h('span', { class: 'row-arrow' }, '›'));
}
function section(title, ...rows) {
  const kids = rows.flat().filter(Boolean);
  if (!kids.length) return null;
  return h('div', { class: 'section' }, h('div', { class: 'section-title' }, title), kids);
}

function careerPanel() {
  const e = G.edu, out = h('div', {});
  out.append(h('div', { class: 'info' }, h('div', {}, `🎓 Education: `, h('b', {}, EDU_NAMES[e.level])),
    e.stage ? h('div', {}, `📍 Currently: `, h('b', {}, e.stage), e.stage === 'University' || e.stage === 'Graduate School' ? ` (year ${e.years + 1})` : '') : null,
    G.debt > 0 ? h('div', {}, `💳 Debt: `, h('b', {}, money(G.debt))) : null));
  if (G.prison > 0) { out.append(h('p', { class: 'muted' }, 'You’re in prison. No school or work until you’re out.')); return out; }
  if (G.age < 5) { out.append(h('p', { class: 'muted' }, 'You’re too young for school. Enjoy being little!')); return out; }

  if (e.stage) {
    out.append(section('School',
      row('📖', 'Study harder', 'Boost your smarts', actStudy),
      ['Elementary School', 'Middle School', 'High School'].includes(e.stage) ? row('🛹', 'Skip class', 'Have fun, learn less', actSkipClass) : null,
      G.age >= 16 ? row('🚪', 'Drop out', '', actDropOut, { cls: 'danger' }) : null));
  } else if (G.age >= 18) {
    out.append(section('Education',
      e.level === 1 ? row('🏛️', 'Enroll in university', '4 years · $40,000 in loans', actEnrollUni) : null,
      e.level === 2 ? row('🏛️', 'Enroll in graduate school', '3 years · $80,000 in loans · unlocks top jobs', actGradSchool) : null,
      e.level === 0 && e.dropped ? row('📄', 'Get your GED', 'Earn a high school equivalency', () => { if (!once('ged')) return; if (chance(G.stats.smarts / 100 + 0.3)) { e.level = 1; say('📄 You earned your GED!', 'good'); toast('You passed!'); } else toast('You failed the GED. Try again next year.'); }) : null));
  }

  if (G.job) {
    const j = G.job;
    out.append(section('Your Job',
      h('div', { class: 'info' }, h('div', {}, h('b', {}, jobTitle(j))), h('div', {}, `Salary: ${money(j.salary)}/yr · ${j.years} yr${j.years === 1 ? '' : 's'}`),
        statBar('Performance', j.perf)),
      row('💪', 'Work harder', 'Improve your performance', actWorkHarder),
      row('💵', 'Ask for a raise', '', actRaise),
      G.age >= 60 && !j.pt ? row('🏖️', 'Retire', 'Collect a pension', actRetireJob) : null,
      row('🚪', 'Quit', '', actQuit, { cls: 'danger' })));
  } else if (G.age >= 12) {
    out.append(section(G.age < 18 ? 'Part-Time Jobs' : 'Job Listings',
      jobOffers().map(j => row('💼', j.t, `${money(j.s)}/yr · ${j.edu ? EDU_NAMES[j.edu] : 'No degree needed'}${j.sm ? ` · smarts ${j.sm}+` : ''}`, () => actApply(j)))));
  }
  return out;
}

function peoplePanel() {
  const order = ['Parent', 'Sibling', 'Spouse', 'Partner', 'Child', 'Friend', 'Ex'];
  const groups = order.map(r => [r, G.people.filter(p => p.role === r)]).filter(([, l]) => l.length);
  if (!groups.length) return h('p', { class: 'muted' }, 'You don’t have anyone in your life right now.');
  const names = { Parent: 'Parents', Sibling: 'Siblings', Spouse: 'Spouse', Partner: 'Partner', Child: 'Children', Friend: 'Friends', Ex: 'Exes' };
  return h('div', {}, groups.map(([r, list]) => section(names[r],
    list.sort((a, b) => b.alive - a.alive).map(p => row(personEmoji(p), fullName(p),
      p.alive ? `${roleLabel(p)} · Age ${p.age} · ❤️ ${p.bond}%${G.super && !G.super.exposed && p.knows ? ' · 🤫 knows' : ''}` : `${roleLabel(p)} · Deceased`,
      () => personActions(p), { disabled: !p.alive, why: `${p.first} has passed away.` })))));
}

function activitiesPanel() {
  const a = G.age;
  if (G.prison > 0) {
    return h('div', {}, section('Prison',
      row('💪', 'Work out in the yard', '', actPrisonWorkout),
      row('📖', 'Prison library', '', actPrisonRead),
      row('🔓', 'Attempt a prison break', G.super ? `Powers help · ~${Math.round(clamp(0.08 + pw('escape') / 100 + G.super.level / 300, 0, 1) * 100)}% chance` : 'Very risky', actBreakOut, { cls: 'danger' })));
  }
  if (a < 3) return h('p', { class: 'muted' }, 'You’re a baby. Your only activity is napping. Tap Age to grow up!');
  return h('div', {},
    section('Mind & Body',
      a >= 12 ? row('🏋️', 'Gym', 'Health & looks', actGym) : null,
      row('📚', 'Library', 'Smarts', actLibrary),
      a >= 8 ? row('🧘', 'Meditate', G.super ? 'Happiness & power control' : 'Happiness', actMeditate) : null,
      row('🩺', 'Doctor', a < 18 ? 'Free for kids' : '$800', actDoctor)),
    section('Social',
      a >= 16 ? row('🍸', 'Night out', 'Happiness', actNightOut) : null,
      a >= 16 && !partner() ? row('💘', 'Find love', 'Meet someone new', actFindLove) : null,
      a >= 18 ? row('✈️', 'Vacation', '$3,500', actVacation) : null),
    a >= 18 ? section('Money', row('🎰', 'Lottery ticket', '$10 · tap as much as you want', actLottery)) : null);
}

function powersPanel() {
  const s = G.super;
  if (!s || !s.alignment) {
    const left = G.originAge - G.age;
    return h('div', { class: 'locked-panel' },
      h('div', { class: 'big' }, '❓'),
      h('h3', {}, 'Your powers have not awakened… yet.'),
      h('p', {}, 'Every person in this world has a destiny. Sometime before you turn 18, something will happen that changes your life forever.'),
      h('p', { class: 'muted' }, left > 0 ? 'Keep living. Keep aging. Watch for the signs.' : 'It could be any moment now…'));
  }
  const p = POWERS[s.power], hero = s.alignment === 'hero';
  const out = h('div', {});
  const n = s.nemesis;
  out.append(h('div', { class: `hero-card ${s.alignment}` },
    h('div', { class: 'hc-top' },
      h('div', { class: 'hc-emoji' }, hero ? '🦸' : '🦹'),
      h('div', {},
        h('div', { class: 'hc-name' }, s.alias),
        h('div', { class: 'hc-sub' }, `${hero ? 'Superhero' : 'Supervillain'} · ${tierName(s.level)}${s.retired ? ' · Retired' : ''}${s.ruler ? ' · 🌍 Ruler of Earth' : ''}${s.savedWorld ? ' · 🌍 Savior of Earth' : ''}`),
        h('div', { class: 'hc-sub' }, s.exposed ? `🎭 Identity public: ${G.first} ${G.last}` : `🎭 Secret identity: ${G.first} ${G.last}`))),
    h('div', { class: 'hc-powers' },
      h('span', { class: 'pill' }, `${p.emoji} ${p.name}`),
      s.second ? h('span', { class: 'pill' }, `${POWERS[s.second].emoji} ${POWERS[s.second].name}`) : null),
    h('div', { class: 'hc-origin' }, `Origin: “${s.origin}” at age ${s.originAge} · Costume: ${s.color} ${COSTUMES[s.costume].name}`),
    statBar('⚡ Power', s.level, 'power'),
    statBar('🎯 Control', s.control),
    statBar(hero ? '🌟 Fame' : '💀 Infamy', s.rep, s.alignment),
    statBar(s.exposed ? '🎭 EXPOSED' : '🎭 Suspicion', s.suspicion, 'danger'),
    statBar('🚨 Wanted', s.heat, 'danger'),
    h('div', { class: 'hc-grid' },
      hero ? h('div', {}, h('b', {}, s.stats.saved.toLocaleString()), h('small', {}, 'people saved'))
        : h('div', {}, h('b', {}, money(s.stats.stolen)), h('small', {}, 'stolen')),
      h('div', {}, h('b', {}, s.stats.defeated), h('small', {}, hero ? 'villains beaten' : 'heroes beaten')),
      h('div', {}, h('b', {}, s.stats.missions), h('small', {}, 'missions')),
      h('div', {}, h('b', {}, '⚡'.repeat(Math.max(0, s.energy)) || '—'), h('small', {}, 'energy left'))),
    h('div', { class: 'hc-extra' },
      s.team ? h('div', {}, `🤝 Team: ${s.team.name}`) : null,
      s.agency ? h('div', {}, '🕴️ Agent of the Bureau of Metahuman Affairs') : null,
      s.sidekick ? h('div', {}, `🫡 ${hero ? 'Sidekick' : 'Henchman'}: ${s.sidekick.name}`) : null,
      s.base >= 0 ? h('div', {}, `🏰 Base: ${BASES[s.base].name[s.alignment]}`) : null,
      s.gadgets.length ? h('div', {}, `🧰 Gear: ${s.gadgets.map(id => GADGETS.find(g => g.id === id).emoji).join(' ')}`) : null,
      s.registered === true ? h('div', {}, '📜 Registered superhuman') : s.registered === false ? h('div', {}, '📜 Unregistered (outlaw)') : null,
      n ? h('div', { class: 'nemesis' }, `😈 Nemesis: ${n.name} (${POWERS[n.power].emoji} ${POWERS[n.power].name}, power ${n.level}) — ${!n.alive ? 'destroyed' : n.jailed ? `in prison (${n.jailed} yr)` : 'at large'} · ${n.losses}W / ${n.wins}L`) : null)));

  if (G.prison > 0) {
    out.append(section('Behind Bars',
      row('🔓', 'Break out', `~${Math.round(clamp(0.08 + pw('escape') / 100 + s.level / 300, 0, 1) * 100)}% chance`, actBreakOut),
      row('🏋️', 'Train in your cell', 'Uses 1 energy', actTrain)));
    return out;
  }
  if (s.retired) {
    out.append(section('Retired', row('🦸', 'Come out of retirement', 'The world needs you', actRetire)));
    return out;
  }

  const pct = d => `${Math.round(winChance(d) * 100)}% success · 1 energy`;
  out.append(section('Missions', hero ? [
    row('🌃', 'Patrol the city', 'Find trouble, save people · 1 energy', actPatrol),
    s.rep >= 10 ? row('🕵️', 'Hunt a supervillain', '1 energy', actHuntVillain) : row('🕵️', 'Hunt a supervillain', 'Need 10 fame', null, { disabled: true, why: 'Get more famous first.' }),
    n && n.alive ? row('😈', `Hunt down ${n.name}`, nemesisAvailable() ? pct(n.level + 30) : 'They’re in prison', actNemesis, { disabled: !nemesisAvailable(), why: `${n.name} is in prison.` }) : null,
    row('🎤', 'Give a press interview', '+Fame, +suspicion', actPress),
    row('🕶️', 'Lay low', 'Lower suspicion & wanted level', actLayLow),
  ] : [
    row('💰', 'Commit a super-crime', 'Heists, ransoms & more · 1 energy', actCrime),
    row('⚔️', 'Ambush a superhero', '1 energy', actFightHero),
    n && n.alive ? row('😈', `Destroy ${n.name}`, nemesisAvailable() ? pct(n.level + 30) : 'They’re in prison', actNemesis, { disabled: !nemesisAvailable(), why: `${n.name} is in prison.` }) : null,
    row('📺', 'Hijack the airwaves', '+Infamy, +wanted', actPress),
    row('🕶️', 'Lay low', 'Lower wanted level & suspicion', actLayLow),
    s.base >= 1 ? row('☢️', s.doomsday >= 100 ? 'ACTIVATE DOOMSDAY DEVICE' : 'Build a doomsday device', s.doomsday >= 100 ? `Conquer the world · ${pct(85)}` : `${s.doomsday}% complete · $150,000 per step`, actDoomsday, { cls: s.doomsday >= 100 ? 'danger' : '' })
      : row('☢️', 'Build a doomsday device', `Requires a ${BASES[1].name.villain}`, null, { disabled: true, why: `You need a ${BASES[1].name.villain} first.` }),
  ]));

  out.append(section('Training', row('🏋️', `Train your ${p.name}`, 'More power & control · 1 energy', actTrain)));

  const nextC = COSTUMES[s.costume + 1];
  const nextB = BASES[s.base + 1];
  const pm = priceMult();
  out.append(section('Gear & Base',
    nextC ? row('🎭', `Upgrade to ${nextC.name}`, `${money(nextC.cost * pm)} · better at hiding your identity`, actBuyCostume) : null,
    GADGETS.filter(g => !s.gadgets.includes(g.id)).map(g => row(g.emoji, g.name, `${money(g.cost * pm)} · +${g.bonus} combat`, () => actBuyGadget(g))),
    nextB ? row('🏰', nextB.name[s.alignment], `${money(nextB.cost * pm)} · +${nextB.bonus} combat`, actBuyBase) : null));

  out.append(section('Allies',
    s.team ? null : TEAMS[s.alignment].map(t => row('🤝', `Join ${t.name}`, `Needs ${t.rep} ${repWord().toLowerCase()} · ${money(t.pay)}/yr`, () => actJoinTeam(t), { disabled: s.rep < t.rep, why: `You need ${t.rep} ${repWord().toLowerCase()}.` })),
    s.team && TEAMS[s.alignment].some(t => t.rep > s.team.rep) ? TEAMS[s.alignment].filter(t => t.rep > s.team.rep).map(t => row('⬆️', `Join ${t.name}`, `Needs ${t.rep} ${repWord().toLowerCase()} · ${money(t.pay)}/yr`, () => actJoinTeam(t), { disabled: s.rep < t.rep, why: `You need ${t.rep} ${repWord().toLowerCase()}.` })) : null,
    !s.sidekick ? row('🫡', hero ? 'Recruit a sidekick' : 'Hire a henchman', hero ? 'Needs 25 fame' : 'Needs 25 infamy · $20,000/yr', actRecruit) : null));

  out.append(section('Identity',
    !s.exposed ? row('🎭', 'Unmask yourself publicly', 'Reveal your secret identity', actRevealIdentity) : null,
    row(hero ? '😈' : '🕊️', hero ? 'Turn to villainy' : 'Seek redemption', 'Switch sides', actSwitchSides),
    row('🧥', 'Retire', 'Hang up the cape', actRetire, { cls: 'danger' })));
  return out;
}

// ---------- screens ----------
function showStart() {
  closeSheet();
  $('#death').hidden = true;
  const hasSave = load();
  const st = $('#start');
  const citySel = h('select', { id: 'f-city' }, h('option', { value: '' }, 'Random city'), CITIES.map(c => h('option', { value: c }, c)));
  const first = h('input', { id: 'f-first', placeholder: 'First name (optional)', maxlength: 20 });
  const last = h('input', { id: 'f-last', placeholder: 'Last name (optional)', maxlength: 20 });
  const gender = h('select', { id: 'f-gender' }, h('option', { value: '' }, 'Random gender'), h('option', { value: 'm' }, 'Male'), h('option', { value: 'f' }, 'Female'));
  const begin = opts => { newLife(opts); st.hidden = true; renderScrollPending = true; render(); };
  st.replaceChildren(h('div', { class: 'start-card' },
    h('div', { class: 'logo' }, h('span', {}, 'My'), 'Super', h('span', {}, 'Life')),
    h('p', { class: 'tagline' }, 'Live a whole life. Somewhere before 18, your origin story begins.'),
    hasSave ? h('button', { class: 'big-btn alt', onclick: () => { st.hidden = true; renderScrollPending = true; render(); } }, `▶ Continue as ${G.first} ${G.last} (age ${G.age})`) : null,
    h('div', { class: 'form' }, first, last, gender, citySel),
    h('button', { class: 'big-btn', onclick: () => begin({ first: first.value, last: last.value, gender: gender.value, city: citySel.value }) }, '✨ Start New Life'),
    h('button', { class: 'big-btn ghost', onclick: () => begin({}) }, '🎲 Random Life')));
  st.hidden = false;
}

function showDeath() {
  closeSheet();
  const s = G.super;
  const hero = s && s.alignment === 'hero';
  const net = G.money - G.debt;
  let legacy = 'You never discovered your powers.';
  if (s && s.alignment) {
    legacy = hero
      ? `${s.savedWorld ? 'The hero who saved the world. ' : ''}${s.exposed ? 'The world knew you' : 'Only a few ever knew you'} as <b>${esc(s.alias)}</b>, who saved ${s.stats.saved.toLocaleString()} lives and defeated ${s.stats.defeated} villains.`
      : `${s.ruler ? 'Supreme Ruler of Earth. ' : ''}${s.exposed ? 'The world feared you' : 'Your secret died with you'} as <b>${esc(s.alias)}</b>, who stole ${money(s.stats.stolen)} and defeated ${s.stats.defeated} heroes.`;
  }
  const d = $('#death');
  d.replaceChildren(h('div', { class: 'start-card' },
    h('div', { class: 'card-emoji' }, '🪦'),
    h('h2', {}, `${G.first} ${G.last}`),
    s && s.alias ? h('div', { class: `badge big ${s.alignment}` }, `${hero ? '🦸' : '🦹'} ${s.alias}`) : null,
    h('p', {}, `Died at age ${G.age} from ${G.cause}.`),
    h('p', { html: legacy }),
    h('div', { class: 'info' },
      h('div', {}, `💰 Net worth: ${money(net)}`),
      h('div', {}, `🎓 ${EDU_NAMES[G.edu.level]}`),
      h('div', {}, `💼 ${G.job ? jobTitle(G.job) : G.retiredJob ? 'Retired' : 'No job'}`),
      s && s.alignment ? h('div', {}, `${POWERS[s.power].emoji} ${POWERS[s.power].name} · ${tierName(s.level)}`) : null,
      s && s.nemesis ? h('div', {}, `😈 Nemesis: ${s.nemesis.name}`) : null),
    h('button', { class: 'big-btn', onclick: () => { clearSave(); showStart(); } }, '✨ New Life')));
  d.hidden = false;
}

// ---------- boot ----------
window.addEventListener('DOMContentLoaded', () => {
  $('#age-btn').addEventListener('click', () => { closeSheet(); renderScrollPending = true; ageUp(); });
  document.querySelectorAll('[data-sheet]').forEach(b => b.addEventListener('click', () => {
    const name = b.dataset.sheet;
    if (currentSheet === name) closeSheet(); else openSheet(name);
  }));
  $('#sheet-close').addEventListener('click', closeSheet);
  $('#menu-btn').addEventListener('click', () => popup({
    emoji: '⚙️', title: 'Menu', text: 'Your life saves automatically.',
    choices: [
      { label: '🔄 Start a new life', fn: () => popup({ emoji: '⚠️', title: 'Are you sure?', text: 'Your current life will be lost forever.', choices: [{ label: 'Yes, start over', fn: () => { clearSave(); showStart(); } }, { label: 'Cancel' }] }) },
      { label: 'Close' },
    ],
  }));
  showStart();
});

</script>
</body>
</html>

<title>MySuperLife</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #14112b;
  --panel: #1f1a3d;
  --panel-2: #2a2452;
  --ink: #f3f0ff;
  --muted: #a49fc7;
  --line: #3a3370;
  --accent: #ffd23f;
  --hero: #3fa9ff;
  --villain: #e0435a;
  --power: #b15cff;
  --ok: #3ddc84;
  --warn: #ffb020;
  --bad: #ff4d5e;
  --radius: 14px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(circle at 20% 0%, #2b1f63 0%, var(--bg) 55%) fixed;
  color: var(--ink);
  font-family: 'Nunito', system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

#app {
  max-width: 520px; height: 100%; margin: 0 auto;
  display: flex; flex-direction: column; position: relative;
  background: rgba(10, 8, 30, 0.35);
  border-left: 1px solid var(--line); border-right: 1px solid var(--line);
}

/* ---------- top bar ---------- */
#topbar {
  display: flex; align-items: center; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
  background: var(--panel); border-bottom: 3px solid var(--accent);
}
#avatar { font-size: 34px; width: 48px; height: 48px; display: grid; place-items: center; background: var(--panel-2); border-radius: 50%; border: 2px solid var(--line); }
.who { flex: 1; min-width: 0; }
#name { font-weight: 900; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sub { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.right { display: flex; align-items: center; gap: 8px; }
#money { font-weight: 900; color: var(--ok); font-size: 16px; }
#money.neg { color: var(--bad); }
#menu-btn { background: none; border: none; font-size: 22px; padding: 4px 6px; }

.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-weight: 800; font-size: 11.5px; color: #fff; background: var(--power); }
.badge.hero { background: var(--hero); }
.badge.villain { background: var(--villain); }
.badge.big { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-size: 22px; letter-spacing: 1px; padding: 4px 14px; margin: 4px 0 10px; }

/* ---------- log ---------- */
#log { flex: 1; overflow-y: auto; padding: 12px 14px 20px; scroll-behavior: smooth; }
.year { margin-bottom: 14px; }
.year-age { font-weight: 900; color: var(--accent); font-size: 14px; margin-bottom: 4px; }
.year p { margin: 3px 0; font-size: 14.5px; line-height: 1.45; }
.year p.good { color: #8ff0b8; }
.year p.bad { color: #ff9aa5; }
.year p.hint { color: var(--muted); font-style: italic; }
.year p.super { color: #e5c6ff; font-weight: 700; }

/* ---------- stats ---------- */
#stats { padding: 8px 14px; background: var(--panel); border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
.stat { display: grid; grid-template-columns: 92px 1fr 34px; align-items: center; gap: 6px; font-size: 11.5px; }
.stat-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-weight: 700; }
.stat-val { text-align: right; font-weight: 800; }
.bar { height: 9px; background: #0d0b20; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.fill { height: 100%; border-radius: 99px; transition: width .35s ease; }

/* ---------- nav ---------- */
#nav {
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
  padding: 6px 6px calc(8px + env(safe-area-inset-bottom));
  background: var(--panel-2); border-top: 1px solid var(--line);
}
#nav button { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 800; color: var(--muted); padding: 4px 0; }
#nav button span { font-size: 22px; }
#age-btn span {
  width: 62px; height: 62px; margin-top: -26px; border-radius: 50%;
  display: grid; place-items: center; font-size: 34px !important; font-weight: 900; color: #1a1300;
  background: var(--accent); border: 4px solid var(--panel-2); box-shadow: 0 4px 18px rgba(255, 210, 63, .45);
  transition: transform .1s;
}
#age-btn:active span { transform: scale(.92); }
#age-btn { color: var(--accent) !important; }
#nav-powers.locked span { filter: grayscale(1) opacity(.5); }
#nav-powers.glow span { animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 8px var(--power)); transform: scale(1.08); } }

/* ---------- sheet ---------- */
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0; top: 70px; z-index: 20;
  background: var(--panel); border-top: 3px solid var(--accent); border-radius: 18px 18px 0 0;
  display: flex; flex-direction: column; animation: up .2s ease;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet-head h3 { flex: 1; margin: 0; font-family: 'Bangers', Impact, 'Arial Black', sans-serif; letter-spacing: 1px; font-size: 24px; font-weight: 400; }
#sheet-close { background: var(--panel-2); border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; }
#sheet-body { flex: 1; overflow-y: auto; padding: 12px 14px calc(30px + env(safe-area-inset-bottom)); }

.section { margin-bottom: 16px; }
.section-title { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); margin: 4px 2px 8px; }
.row {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 11px 12px; margin-bottom: 7px; transition: transform .08s, background .15s;
}
.row:active { transform: scale(.98); background: #352d66; }
.row.disabled { opacity: .45; }
.row.danger b { color: #ff9aa5; }
.row-emoji { font-size: 24px; width: 30px; text-align: center; }
.row-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.row-main b { font-size: 15px; }
.row-main small { color: var(--muted); font-size: 12px; margin-top: 1px; }
.row-arrow { color: var(--muted); font-size: 22px; }
.info { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; font-size: 14px; line-height: 1.7; }
.info .stat { margin-top: 4px; }
.muted { color: var(--muted); }

.locked-panel { text-align: center; padding: 30px 14px; }
.locked-panel .big { font-size: 72px; animation: glow 2s infinite; }
.locked-panel h3 { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-weight: 400; letter-spacing: 1px; font-size: 26px; margin: 10px 0; }
.locked-panel p { line-height: 1.5; }

/* hero card */
.hero-card {
  border-radius: 18px; padding: 14px; margin-bottom: 16px; border: 2px solid var(--power);
  background: linear-gradient(145deg, #3a1f6b, #1f1a3d);
}
.hero-card.hero { border-color: var(--hero); background: linear-gradient(145deg, #173a6b, #1f1a3d); }
.hero-card.villain { border-color: var(--villain); background: linear-gradient(145deg, #5c1730, #1f1a3d); }
.hc-top { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.hc-emoji { font-size: 46px; }
.hc-name { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-size: 30px; letter-spacing: 1.5px; line-height: 1; text-shadow: 2px 2px 0 rgba(0,0,0,.5); }
.hc-sub { font-size: 12.5px; color: #d5d0f5; margin-top: 3px; }
.hc-powers { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.pill { background: rgba(255,255,255,.12); padding: 4px 10px; border-radius: 99px; font-weight: 800; font-size: 13px; }
.hc-origin { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.hero-card .stat { grid-template-columns: 100px 1fr 36px; margin-bottom: 5px; }
.hc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 8px; text-align: center; }
.hc-grid div { background: rgba(0,0,0,.25); border-radius: 10px; padding: 6px 2px; display: flex; flex-direction: column; }
.hc-grid b { font-size: 14px; }
.hc-grid small { font-size: 10px; color: var(--muted); }
.hc-extra { font-size: 13px; line-height: 1.7; }
.hc-extra .nemesis { color: #ffb3bd; font-weight: 700; }

/* ---------- modal ---------- */
#modal {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 18px;
  background: rgba(5, 3, 18, .72); backdrop-filter: blur(3px);
}
.card {
  width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto;
  background: var(--panel); border: 3px solid var(--accent); border-radius: 20px; padding: 20px 18px 16px;
  text-align: center; box-shadow: 0 10px 50px rgba(0,0,0,.6); animation: pop .22s cubic-bezier(.2,1.4,.5,1);
}
.card.origin { border-color: var(--power); background: radial-gradient(circle at 50% 0%, #4a2591, var(--panel) 70%); box-shadow: 0 0 60px rgba(177, 92, 255, .45); }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.card-emoji { font-size: 56px; line-height: 1.1; }
.card h2 { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-weight: 400; letter-spacing: 1.5px; font-size: 30px; margin: 6px 0 8px; color: var(--accent); }
.card-text { font-size: 15px; line-height: 1.5; margin-bottom: 14px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choices.grid { display: grid; grid-template-columns: 1fr 1fr; }
.choice {
  background: var(--panel-2); border: 2px solid var(--line); border-radius: 12px; padding: 12px;
  font-weight: 800; font-size: 15px; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.choice:active { transform: scale(.97); }
.choice:hover { border-color: var(--accent); }
.choice small { font-weight: 600; font-size: 11.5px; color: var(--muted); }
.choice.hero { background: var(--hero); border-color: #8fd0ff; color: #fff; font-size: 17px; }
.choice.villain { background: var(--villain); border-color: #ff9aa5; color: #fff; font-size: 17px; }
.name-input {
  width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--power); background: #0d0b20; color: var(--ink);
  font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-size: 24px; letter-spacing: 1px; text-align: center; margin-bottom: 10px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 14px; }
.chip { background: rgba(255,255,255,.1); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
.chip:active { background: var(--power); }

/* ---------- screens ---------- */
.screen {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px; overflow-y: auto;
  background: radial-gradient(circle at 50% 10%, #3b2380 0%, var(--bg) 65%);
}
.start-card { width: 100%; max-width: 400px; text-align: center; }
.start-card h2 { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-weight: 400; font-size: 34px; letter-spacing: 1.5px; margin: 6px 0; }
.start-card p { line-height: 1.5; }
.logo {
  font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-size: 64px; letter-spacing: 2px; line-height: 1; color: var(--accent);
  text-shadow: 3px 3px 0 var(--villain), 6px 6px 0 rgba(0,0,0,.4); transform: rotate(-3deg); margin: 10px 0 6px;
}
.logo span { color: #fff; font-size: 44px; }
.tagline { color: var(--muted); margin-bottom: 22px; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.form input, .form select {
  width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 15px;
}
.big-btn {
  display: block; width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 14px; border: none;
  background: var(--accent); color: #1a1300; font-weight: 900; font-size: 17px; box-shadow: 0 4px 0 #b8901a;
}
.big-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8901a; }
.big-btn.alt { background: var(--hero); color: #fff; box-shadow: 0 4px 0 #1f6cb0; }
.big-btn.ghost { background: var(--panel-2); color: var(--ink); box-shadow: 0 4px 0 #120f2a; }
#death .info { text-align: left; }

#toast {
  position: fixed; left: 50%; bottom: 120px; transform: translate(-50%, 20px); z-index: 60;
  background: #0d0b20; border: 2px solid var(--accent); color: var(--ink); padding: 10px 18px; border-radius: 99px;
  font-weight: 800; font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 380px) {
  #stats { grid-template-columns: 1fr; }
  .stat { grid-template-columns: 100px 1fr 36px; }
}

/* adventures & shop */
.card.adventure { border-color: var(--hero); background: radial-gradient(circle at 50% 0%, #1d3f73, var(--panel) 70%); }
.fx-summary { margin-top: 12px; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.3); font-weight: 800; font-size: 13.5px; color: var(--accent); }
.row.feature { border-color: var(--accent); background: linear-gradient(135deg, #3d3270, var(--panel-2)); }
.row.done { opacity: .6; }
.wardrobe { font-size: 22px; margin: -4px 2px 14px; letter-spacing: 2px; }
#money { cursor: pointer; }

/* battles */
.card.battle { border-color: var(--villain); background: radial-gradient(circle at 50% 0%, #5c1730, var(--panel) 70%); }
.card.battle .card-text p { margin: 0 0 10px; }
.blog { background: rgba(0,0,0,.3); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; font-size: 14px; text-align: left; }
.hp { display: grid; grid-template-columns: 90px 1fr 32px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; text-align: left; }
.hp span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 800; }
.hp-bar { height: 12px; background: #0d0b20; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.hp-fill { height: 100%; transition: width .3s; }
.hp-fill.you { background: linear-gradient(90deg, var(--ok), #8ff0b8); }
.hp-fill.foe { background: linear-gradient(90deg, var(--bad), #ff9aa5); }
.stam { font-size: 13px; color: var(--accent); font-weight: 800; margin-top: 4px; }
.choice.sig { border-color: var(--accent); background: linear-gradient(135deg, #5a4a10, var(--panel-2)); }
.pill.move { background: rgba(255, 210, 63, .18); color: var(--accent); }

/* city */
.city-map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.district { position: relative; overflow: hidden; border-radius: 12px; padding: 8px 6px; text-align: center; background: var(--panel-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 1px; }
.district::before { content: ''; position: absolute; inset: auto 0 0 0; height: var(--crime); background: rgba(255, 77, 94, .22); }
.district > * { position: relative; }
.district .d-emoji { font-size: 22px; }
.district b { font-size: 11.5px; line-height: 1.2; }
.district small { font-size: 10.5px; color: var(--muted); }
.district.safe { border-color: var(--ok); }
.district.danger { border-color: var(--bad); }
.district.owned { border-color: var(--villain); background: #3d1428; }

/* profile & meta */
.goal { padding: 8px 10px; background: var(--panel-2); border-radius: 10px; margin-bottom: 6px; font-size: 14px; }
.goal.done { color: #8ff0b8; }
.goal small { color: var(--muted); }
.ach-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ach { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px; text-align: center; display: flex; flex-direction: column; gap: 2px; opacity: .45; }
.ach.got { opacity: 1; border-color: var(--accent); }
.ach span { font-size: 22px; }
.ach b { font-size: 11px; }
.ach small { font-size: 9.5px; color: var(--muted); }
#badge-pop {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -120%); z-index: 70;
  background: linear-gradient(135deg, #5a4a10, var(--panel)); border: 2px solid var(--accent); border-radius: 14px; padding: 8px 16px;
  font-weight: 900; text-align: center; transition: transform .35s cubic-bezier(.2,1.4,.5,1); pointer-events: none; max-width: 90vw;
}
#badge-pop small { display: block; font-size: 10.5px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
#badge-pop.show { transform: translate(-50%, 0); }
.year p.news { color: #ffe08a; font-family: Georgia, 'Times New Roman', serif; }
.year p.achievement { color: var(--accent); font-weight: 800; }
.ribbon { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; background: linear-gradient(135deg, #5a4a10, var(--panel)); border: 2px solid var(--accent); border-radius: 14px; padding: 8px 18px; margin: 8px 0; }
.ribbon span { font-size: 30px; }
.ribbon b { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-size: 24px; letter-spacing: 1px; color: var(--accent); font-weight: 400; }
.ribbon small { color: var(--muted); }
.heirs { margin: 14px 0 6px; }
.link-btn { background: none; border: none; color: var(--muted); font-weight: 800; padding: 10px; text-decoration: underline; }
.legend-row { text-align: left; padding: 8px 0; border-bottom: 1px solid var(--line); }
.legend-row small { color: var(--muted); }
#avatar { cursor: pointer; }
.stat.up .stat-val { color: var(--ok); animation: bump .6s; }
.stat.down .stat-val { color: var(--bad); animation: bump .6s; }
@keyframes bump { 40% { transform: scale(1.35); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- immersion ---------- */
body { transition: background .8s; }
body[data-mood="hero"] { background: radial-gradient(circle at 20% 0%, #163a73 0%, var(--bg) 60%) fixed; }
body[data-mood="villain"] { background: radial-gradient(circle at 20% 0%, #5a1430 0%, #120a1c 60%) fixed; }
body[data-mood="prison"] { background: repeating-linear-gradient(90deg, #15141c 0 34px, #22202c 34px 40px) fixed; }
body[data-mood="child"] { background: radial-gradient(circle at 20% 0%, #3b2a7a 0%, var(--bg) 60%) fixed; }

#phone-btn { position: relative; background: none; border: none; font-size: 22px; padding: 2px 4px; }
#phone-badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 900; display: grid; place-items: center; }

.year.fresh p { opacity: 0; animation: lineIn .45s ease forwards; }
@keyframes lineIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.year p.thought { color: #b9b3e6; }
.year p.world { color: #9fd3ff; }
.year p.quest { color: #ffd88a; font-weight: 700; }
.year p.chapter { color: var(--accent); font-weight: 800; }

.card.chapter { border-color: var(--accent); background: radial-gradient(circle at 50% 0%, #4d3d0d, var(--panel) 70%); }
.chapter-name { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-size: 30px; letter-spacing: 1.5px; color: #fff; margin-bottom: 6px; }
.chapter-sum { background: rgba(0,0,0,.3); border-radius: 10px; padding: 8px; font-size: 13px; line-height: 1.7; margin: 10px 0; }
.card.quest { border-color: #e0a84a; background: radial-gradient(circle at 50% 0%, #4a3412, var(--panel) 70%); }
.quest-tag { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #e0a84a; font-weight: 900; margin-bottom: 8px; }
.card.phone { border-color: var(--hero); }
.sms { background: var(--panel-2); border-radius: 18px 18px 18px 4px; padding: 10px 14px; text-align: left; display: inline-block; max-width: 100%; margin-bottom: 4px; }
.card.wide { max-width: 480px; }
.memoir .card-text { text-align: left; }
.memoir-stage h4 { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-weight: 400; letter-spacing: 1px; color: var(--accent); font-size: 20px; margin: 14px 0 6px; }
.memoir-stage p { margin: 4px 0; font-size: 14px; }
.memoir-stage b { display: inline-block; min-width: 26px; color: var(--muted); }
.memory { padding: 6px 2px; font-size: 13.5px; border-bottom: 1px solid var(--line); }
.memory b { color: var(--muted); margin-right: 4px; }
.big-btn.story { background: #e0a84a; box-shadow: 0 4px 0 #9c6f22; }

.inbox { display: flex; flex-direction: column; gap: 6px; }
.msg { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.msg.unread { border-color: var(--hero); }
.msg.unread b::after { content: ' •'; color: var(--hero); }
.msg.quest { border-color: #e0a84a; }
.msg-emoji { font-size: 24px; }
.msg-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.msg-main small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg-age { color: var(--hero); font-weight: 900; }

/* comic battle FX */
.card { position: relative; }
.burst {
  position: absolute; top: 34%; right: 8%; z-index: 2; pointer-events: none;
  font-family: 'Bangers', Impact, 'Arial Black', sans-serif; font-size: 40px; color: #fff200; letter-spacing: 2px;
  -webkit-text-stroke: 2px #d1001f; text-shadow: 4px 4px 0 #000; transform: rotate(-12deg);
  animation: burst .9s ease-out forwards;
}
.burst.big { font-size: 54px; right: 4%; }
@keyframes burst { 0% { transform: rotate(-12deg) scale(.2); opacity: 0; } 25% { transform: rotate(-12deg) scale(1.25); opacity: 1; } 70% { opacity: 1; } 100% { transform: rotate(-12deg) scale(1); opacity: 0; } }
.card.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translateX(-8px) rotate(-1deg); } 40% { transform: translateX(7px) rotate(1deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
#f-skin { grid-column: 1 / -1; }
@media (prefers-reduced-motion: reduce) { .year.fresh p { opacity: 1; } .burst { opacity: 1; } }

const SAVE_KEY = 'mysuperlife.save.v1';

// ---------- helpers ----------
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const money = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);

function fullName(p) { return `${p.first} ${p.last}`; }
function me() { return { first: G.first, last: G.last }; }
function heShe(g) { return g === 'm' ? 'he' : 'she'; }
function himHer(g) { return g === 'm' ? 'him' : 'her'; }

// ---------- log ----------
function newYearLog() { G.log.push({ age: G.age, lines: [] }); }
function say(text, cls) {
  const y = G.log[G.log.length - 1];
  y.lines.push(cls ? { t: text, c: cls } : { t: text });
  if (typeof remember === 'function' && (cls === 'super' || cls === 'quest' || MEMORY_MARKERS.some(m => text.startsWith(m)))) remember(text);
}

// Apply a bundle of stat changes. Keys: happy health smarts looks money rep sus heat level control
function fx(o) {
  if (!o) return;
  const st = G.stats;
  if (o.happy) st.happy = clamp(st.happy + o.happy);
  if (o.health) st.health = clamp(st.health + o.health);
  if (o.smarts) st.smarts = clamp(st.smarts + o.smarts);
  if (o.looks) st.looks = clamp(st.looks + o.looks);
  if (o.money) G.money += o.money;
  const s = G.super;
  if (s) {
    if (o.rep) s.rep = clamp(s.rep + o.rep);
    if (o.heat) s.heat = clamp(s.heat + o.heat);
    if (o.level) s.level = clamp(s.level + o.level);
    if (o.control) s.control = clamp(s.control + o.control);
    if (o.sus) addSuspicion(o.sus);
  }
}

// ---------- people ----------
function addPerson(p) {
  p.id = (G.nextId = (G.nextId || 0) + 1);
  p.alive = p.alive !== false;
  p.knows = !!p.knows;
  p.bond = p.bond == null ? rand(40, 80) : p.bond;
  G.people.push(p);
  return p;
}
function randomPerson(gender, minAge, maxAge, role, last) {
  gender = gender || pick(['m', 'f']);
  return {
    first: pick(FIRST_NAMES[gender]), last: last || pick(LAST_NAMES), gender, role,
    age: rand(minAge, maxAge), looks: rand(10, 100), skin: pick(SKIN_TONES),
  };
}
function roleLabel(p) {
  const m = p.gender === 'm';
  switch (p.role) {
    case 'Partner': return m ? 'Boyfriend' : 'Girlfriend';
    case 'Spouse': return m ? 'Husband' : 'Wife';
    case 'Child': return m ? 'Son' : 'Daughter';
    case 'Sibling': return m ? 'Brother' : 'Sister';
    case 'Parent': return m ? 'Father' : 'Mother';
    default: return p.role;
  }
}
function living(role) { return G.people.filter(p => p.alive && (!role || p.role === role)); }
function partner() { return G.people.find(p => p.alive && (p.role === 'Partner' || p.role === 'Spouse')); }
function parentName() {
  const p = living('Parent');
  return p.length ? `your ${roleLabel(p[0]).toLowerCase()}` : 'your guardian';
}

// ---------- life ----------
function newLife(opts = {}) {
  const gender = opts.gender || pick(['m', 'f']);
  const last = (opts.last || '').trim() || pick(LAST_NAMES);
  const first = (opts.first || '').trim() || pick(FIRST_NAMES[gender]);
  G = {
    v: 1, alive: true, first, last, gender, city: opts.city || pick(CITIES), age: 0,
    stats: { happy: rand(60, 100), health: rand(75, 100), smarts: rand(10, 90), looks: rand(10, 100) },
    money: 0, debt: 0, assets: [], renting: false,
    edu: { level: 0, stage: '', years: 0, dropped: false },
    job: null, retiredJob: false, pension: 0,
    people: [], nextId: 0, used: {}, log: [], flags: {},
    originAge: rand(5, 17), super: null, prison: 0, cause: null,
    pets: [], social: { followers: 0 }, invest: {}, conditions: [], achievements: [], generation: 1,
  };
  G.goals = pickGoals();
  initCity();
  const wealth = pick([0.5, 1, 1, 1, 2, 4]);
  G.familyWealth = wealth;
  G.skin = opts.skin != null && opts.skin !== 'random' ? opts.skin : pick(SKIN_TONES);
  const mom = addPerson({ ...randomPerson('f', 22, 40, 'Parent', last), bond: rand(60, 100), skin: G.skin });
  const dad = addPerson({ ...randomPerson('m', 22, 42, 'Parent', last), bond: rand(50, 100), skin: G.skin });
  const sibs = rand(0, 2);
  for (let i = 0; i < sibs; i++) addPerson({ ...randomPerson(null, 1, 9, 'Sibling', last), bond: rand(40, 90), skin: G.skin });

  newYearLog();
  say(`You were born a ${gender === 'm' ? 'boy' : 'girl'} in ${G.city}, a city where people whisper about masked vigilantes on the rooftops.`);
  say(`Your name is ${first} ${last}.`);
  say(`Your mother is ${fullName(mom)}, age ${mom.age}. Your father is ${fullName(dad)}, age ${dad.age}.`);
  living('Sibling').forEach(s => say(`You have an older ${roleLabel(s).toLowerCase()}, ${s.first}, age ${s.age}.`));
  if (wealth >= 2) say('Your family is wealthy.');
  else if (wealth < 1) say('Your family doesn’t have much money.');
  save();
}

function ageUp() {
  if (!G || !G.alive || isModalOpen()) return;
  G.age++;
  G.used = {};
  G.jobOffers = null;
  G.lastInjury = null;
  newYearLog();
  if (G.age >= 2 && chance(0.45)) innerThought();

  yearlyStats();
  peopleTick();
  if (G.prison > 0) prisonTick(); else { schoolTick(); jobTick(); }
  moneyTick();
  assetsTick();
  investTick();
  socialTick();
  petsTick();
  illnessTick();
  if (G.super) superYearly();
  worldNews();
  focusYearly();
  phoneYearly();
  questYearly();

  if (naturalDeath()) return;

  if (!G.super && G.age === G.originAge && G.prison === 0) {
    triggerOrigin();
  } else {
    if (!G.super && G.age >= 3 && chance(0.25)) say(pick(HINTS), 'hint');
    runYearEvents();
  }
  checkChapter();
  sfx('age');
  if (!isModalOpen()) nextModal();
}

function yearlyStats() {
  const st = G.stats;
  st.happy = clamp(st.happy + rand(-4, 3));
  if (G.age > 40) st.health = clamp(st.health - rand(0, Math.ceil((G.age - 35) / 10)));
  else st.health = clamp(st.health + rand(0, 3));
  if (G.age > 30 && chance(0.5)) st.looks = clamp(st.looks - 1);
  if (G.age < 18 && chance(0.3)) st.looks = clamp(st.looks + rand(-2, 3));
  if (G.super && pw('heal')) st.health = clamp(st.health + pw('heal'));
}

function peopleTick() {
  G.people.forEach(p => {
    if (!p.alive) return;
    p.age++;
    p.bond = clamp(p.bond - rand(0, 3));
    let risk = p.age < 60 ? 0.002 : 0.01 + (p.age - 60) * 0.008;
    if (risk > 0 && chance(risk)) {
      p.alive = false;
      say(`💔 Your ${roleLabel(p).toLowerCase()}, ${fullName(p)}, died at age ${p.age}.`, 'bad');
      fx({ happy: p.bond > 40 ? -rand(10, 25) : -rand(0, 5) });
    }
  });
}

function schoolTick() {
  const e = G.edu, st = G.stats;
  if (!e.dropped) {
    if (G.age === 5) { e.stage = 'Elementary School'; say('🎒 You started elementary school.'); }
    if (G.age === 11) { e.stage = 'Middle School'; say('🏫 You started middle school.'); }
    if (G.age === 14) { e.stage = 'High School'; say('🏫 You started high school.'); }
  }
  if (['Elementary School', 'Middle School', 'High School'].includes(e.stage)) st.smarts = clamp(st.smarts + rand(0, 3));
  if (G.age === 18 && e.stage === 'High School') {
    e.stage = '';
    e.level = Math.max(e.level, 1);
    say('🎓 You graduated from high school!', 'good');
    fx({ happy: 8 });
    collegePrompt();
  }
  if (e.stage === 'University') {
    e.years++; st.smarts = clamp(st.smarts + rand(1, 4));
    if (e.years >= 4) { e.stage = ''; e.level = 2; say('🎓 You graduated from university with a bachelor’s degree!', 'good'); fx({ happy: 10 }); }
  } else if (e.stage === 'Graduate School') {
    e.years++; st.smarts = clamp(st.smarts + rand(1, 4));
    if (e.years >= 3) { e.stage = ''; e.level = 3; say('🎓 You earned your graduate degree!', 'good'); fx({ happy: 10 }); }
  }
}

function collegePrompt() {
  popup({
    emoji: '🎓', title: 'What’s Next?',
    text: 'You graduated from high school! Do you want to go to university?',
    choices: [
      { label: 'Enroll (student loans: $40,000)', fn: () => enrollUni(true) },
      { label: 'Ask your parents to pay', show: () => living('Parent').length > 0, fn: () => {
        const p = living('Parent').sort((a, b) => b.bond - a.bond)[0];
        if (chance(0.25 * G.familyWealth + p.bond / 300)) {
          say(`Your ${roleLabel(p).toLowerCase()} agreed to pay for your tuition!`, 'good');
          enrollUni(false);
        } else {
          result('😬', 'No Luck', `Your ${roleLabel(p).toLowerCase()} said they can’t afford it. You took out student loans instead.`);
          enrollUni(true);
        }
      } },
      { label: 'Skip college', fn: () => say('You decided not to go to college.') },
    ],
  });
}
function enrollUni(loan) {
  G.edu.stage = 'University'; G.edu.years = 0;
  if (loan) G.debt += 40000;
  say('🏛️ You enrolled at Valor State University.');
}

function jobTick() {
  const j = G.job;
  if (!j) return;
  j.years++;
  j.perf = clamp(j.perf + rand(-8, 6));
  if (j.perf >= 70 && j.years >= 2 && j.rank < RANKS.length - 1 && !j.pt && chance(0.35)) {
    j.rank++; j.salary = Math.round(j.salary * (1.12 + Math.random() * 0.1));
    say(`📈 You were promoted to ${jobTitle(j)}! Your new salary is ${money(j.salary)}.`, 'good');
    fx({ happy: 8 });
  } else if (j.perf < 20 && chance(0.4)) {
    say(`📉 You were fired from your job as a ${jobTitle(j)}.`, 'bad');
    G.job = null; fx({ happy: -15 });
  }
}
function jobTitle(j) { return RANKS[j.rank || 0] + j.t; }

function moneyTick() {
  if (G.job && G.prison === 0) G.money += Math.round(G.job.salary * (G.job.pt ? 0.9 : 0.65));
  if (G.pension) G.money += G.pension;
  if (G.super && G.super.agency && !G.super.retired && G.prison === 0) G.money += 90000;
  if (G.debt > 0 && G.money > 0) {
    const pay = Math.min(G.debt, Math.max(3000, Math.round(G.money * 0.2)), G.money);
    G.debt -= pay; G.money -= pay;
    if (G.debt === 0) say('🎉 You paid off all of your debt!', 'good');
  }
  // Adults without income slowly burn money on living costs.
  if (G.age >= 18 && G.prison === 0 && !G.job && !G.edu.stage && G.money > 0) G.money -= Math.min(G.money, 8000);
}

function prisonTick() {
  G.prison--;
  fx({ happy: -rand(3, 8), health: -rand(0, 3) });
  if (G.prison <= 0) {
    G.prison = 0;
    say('🔓 You were released from prison!', 'good');
    fx({ happy: 15 });
  } else say(`⛓️ You are in prison. ${G.prison} year${G.prison === 1 ? '' : 's'} left.`);
}

function naturalDeath() {
  let risk = 0;
  if (G.age > 55) risk = Math.pow((G.age - 55) / 50, 2.2);
  if (G.super && pw('heal')) risk *= 0.4;
  const sick = G.stats.health < 20 ? 0.08 : 0;
  if (G.stats.health <= 0 || chance(sick)) { die(G.lastInjury || 'poor health'); return true; }
  if (chance(risk)) { die('old age'); return true; }
  return false;
}

function die(cause) {
  if (!G.alive) return;
  G.alive = false;
  G.cause = cause;
  Q.length = 0; current = null; $('#modal').hidden = true;
  say(`☠️ You died at age ${G.age} from ${cause}.`, 'bad');
  sfx('bad');
  recordLegend();
  save();
  showDeath();
}

// After each popup chain, check whether something killed us.
function checkDeath() {
  if (G && G.alive && G.stats.health <= 0) die(G.lastInjury || 'poor health');
}

// ---------- activities ----------
function once(key) {
  if (G.used[key]) { toast('You already did that this year.'); return false; }
  G.used[key] = true;
  return true;
}

function result(emoji, title, text) {
  popup({ emoji, title, text, choices: [{ label: 'OK' }] });
}

// ---------- persistence ----------
function save() {
  try { if (G) localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { /* storage unavailable */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    G = JSON.parse(raw);
    if (G) {
      G.assets = G.assets || []; G.renting = !!G.renting; G.pets = G.pets || []; G.social = G.social || { followers: 0 };
      G.invest = G.invest || {}; G.conditions = G.conditions || []; G.achievements = G.achievements || [];
      G.generation = G.generation || 1; G.goals = G.goals || pickGoals(); G.flags = G.flags || {};
      if (!G.districts) initCity();
      G.inbox = G.inbox || []; G.quests = G.quests || {}; G.memories = G.memories || []; if (G.skin == null) G.skin = '';
    }
    return !!(G && G.alive);
  } catch (e) { return false; }
}
function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
}

// Superpowers: origin story, secret identity, missions, nemesis, teams, arrests.

function pw(field, def = 0) {
  if (!G.super) return def;
  const a = POWERS[G.super.power][field];
  const b = G.super.second ? POWERS[G.super.second][field] : undefined;
  if (typeof a === 'number' && typeof b === 'number') {
    // multipliers (<1) take the best, bonuses add
    return (field === 'stealth' || field === 'armor' || field === 'gadget') ? Math.min(a, b) : a + Math.round(b / 2);
  }
  return a ?? b ?? def;
}
function isHero() { return G.super && G.super.alignment === 'hero'; }
function alias() { return G.super ? G.super.alias : ''; }
function repWord() { return isHero() ? 'Fame' : 'Infamy'; }
function tierName(l) { return l >= 95 ? 'Omega-Level' : l >= 75 ? 'Legendary' : l >= 50 ? 'Elite' : l >= 25 ? 'Adept' : 'Novice'; }
function maxEnergy() { return 3 + pw('energy', 0); }
function gadgetBonus() { return G.super.gadgets.reduce((t, id) => t + GADGETS.find(g => g.id === id).bonus, 0); }
function baseBonus() { return G.super.base >= 0 ? BASES[G.super.base].bonus : 0; }
function teamBonus() { return G.super.team ? G.super.team.bonus : 0; }
function priceMult() { return pw('gadget', 1) * worldMod('price', 1); }

// Overall combat strength. Starts ~30, tops out ~150.
function combatScore() {
  const s = G.super;
  return s.level + pw('fight') + gadgetBonus() + baseBonus() + teamBonus() + (s.sidekick ? 4 : 0) + superPetBonus() + G.stats.health / 10;
}
function winChance(diff) { return clamp((combatScore() * 1.2 + 40 - diff) / 100, 0.05, 0.95); }

function injure(min, max, cause) {
  const s = G.super;
  let mult = pw('armor', 1);
  if (s && COSTUMES[s.costume].armor) mult *= COSTUMES[s.costume].armor;
  const dmg = Math.round(rand(min, max) * mult);
  G.stats.health = clamp(G.stats.health - dmg);
  G.lastInjury = cause || 'injuries sustained in battle';
  return dmg;
}

function spendEnergy() {
  const s = G.super;
  if (s.energy <= 0) { toast('You’re exhausted. Age up to recover your energy.'); return false; }
  s.energy--;
  return true;
}

function chooseAlignment() {

    ],
  });
}

function suggestAliases(powerId, alignment, gender) {
  const theme = ALIAS.theme[powerId] || ALIAS.heroWords;
  const g = gender === 'm' ? 'm' : 'f';
  const hero = alignment === 'hero';
  const pre = hero ? ALIAS.heroPre[g] : ALIAS.villPre[g];
  const words = hero ? ALIAS.heroWords : ALIAS.villWords;
  const youth = G.age < 18 ? (g === 'm' ? 'boy' : 'girl') : null;
  const out = new Set();
  let guard = 0;
  while (out.size < 6 && guard++ < 60) {
    const t = pick(theme);
    switch (rand(0, 4)) {
      case 0: out.add(`${pick(pre)} ${t}`); break;
      case 1: out.add(t); break;
      case 2: out.add(`The ${t}`); break;
      case 3: out.add(`${pick(pre)} ${pick(words)}`); break;
      default: {
        if (!hero) { out.add(`${t} ${pick(words)}`); break; }
        const suf = youth && chance(0.5) ? youth : pick(ALIAS.heroSuf[g]);
        out.add(t.includes(' ') ? `${t} ${suf[0].toUpperCase()}${suf.slice(1)}` : `${t}${suf === 'Knight' ? ' Knight' : suf}`);
      }
    }
  }
  return [...out];
}

function chooseAlias() {
  const s = G.super;
  popup({
    emoji: s.alignment === 'hero' ? '🦸' : '🦹', title: 'Choose Your Name', cls: 'origin',
    text: `Every ${s.alignment} needs a name the world will remember. Type your own or tap a suggestion.`,
    input: { placeholder: 'Your super name', suggestions: suggestAliases(s.power, s.alignment, G.gender), max: 28 },
    choices: [{ label: 'That’s my name', fn: name => { s.alias = name || suggestAliases(s.power, s.alignment, G.gender)[0]; chooseColor(); } }],
  });
}

function chooseColor() {

function finishOrigin() {

  popup({

      ${p.emoji} <b>${p.name}</b> · ${tierName(s.level)} (power ${s.level})<br>

// ---------- secret identity ----------
function addSuspicion(n) {
  const s = G.super;
  if (!s || s.exposed || n === 0) return;
  if (n > 0) n = Math.round(n * COSTUMES[s.costume].mult * pw('stealth', 1) * worldMod('sus', 1));
  s.suspicion = clamp(s.suspicion + n);
  if (s.suspicion >= 100) exposeIdentity('The press connected the dots.');
}

function exposeIdentity(how) {
  const s = G.super;
  if (s.exposed) return;
  s.exposed = true; s.suspicion = 100;
  G.people.forEach(p => { p.knows = true; });
  const hero = isHero();
  say(`📰 EXPOSED! The whole world now knows that ${esc(s.alias)} is ${esc(G.first)} ${esc(G.last)}.`, 'bad');
  let extra = '';
  if (hero) {
    fx({ rep: 10, happy: -10 });
    extra = 'Fans swarm your house. Reporters camp on your lawn. And every villain now knows where your family lives.';
  } else {
    fx({ heat: 40, happy: -10 });
    extra = 'Your face is on every wanted poster in the country.';
    if (G.job) { say(`You were fired from your job as a ${jobTitle(G.job)}.`, 'bad'); G.job = null; extra += ' Your boss fired you on live TV.'; }
  }
  popup({ emoji: '📰', title: 'Identity Exposed!', text: `${how}<br><br>The headline reads: <b>“${esc(s.alias.toUpperCase())} UNMASKED: IT’S ${esc(G.first.toUpperCase())} ${esc(G.last.toUpperCase())}!”</b><br><br>${extra}`, choices: [{ label: 'Uh oh.' }] });
}

// ---------- yearly ----------
function superYearly() {
  const s = G.super;
  s.energy = maxEnergy();
  if (s.retired) return;
  if (!s.exposed) s.suspicion = clamp(s.suspicion - rand(2, 6));
  s.heat = clamp(s.heat - rand(3, 8));
  if (G.prison === 0) { cityYearly(); if (s.activeLastYear || chance(0.3)) headline(); }
  if (!s.activeLastYear && s.rep > 10) s.rep = clamp(s.rep - rand(1, 4));
  s.activeLastYear = false;
  s.control = clamp(s.control + rand(0, 2));
  if (s.team && G.prison === 0) G.money += s.team.pay;
  if (s.sidekick && !isHero()) {
    const cost = 20000;
    if (G.money >= cost) G.money -= cost;
    else { say(`Your henchman ${s.sidekick.name} quit because you couldn’t pay them.`, 'bad'); s.sidekick = null; }
  }
  const n = s.nemesis;
  if (n && n.alive) {
    n.level = clamp(n.level + rand(1, 4), 1, 120);
    if (n.jailed > 0 && --n.jailed === 0) say(`🚨 Your nemesis ${n.name} has escaped from prison!`, 'bad');
  }
  // Wanted villains (and rogue vigilantes) get hunted down.
  if (G.prison === 0 && s.heat >= 40 && chance((s.heat - 20) / 200)) arrestEvent();
}

function markActive() { G.super.activeLastYear = true; G.super.stats.missions++; }

// ---------- nemesis ----------
function makeNemesis() {
  const s = G.super;
  const hero = isHero();
  const powerId = pick(Object.keys(POWERS).filter(k => k !== s.power));
  s.nemesis = {
    name: pick(hero ? NPC_VILLAINS : NPC_HEROES), power: powerId, alignment: hero ? 'villain' : 'hero',
    level: clamp(s.level + rand(0, 12), 10, 100), wins: 0, losses: 0, alive: true, jailed: 0,
  };
  return s.nemesis;
}
function nemesisAvailable() { const n = G.super.nemesis; return n && n.alive && !n.jailed; }

function fightNemesis(context) {
  const s = G.super, n = s.nemesis;
  const np = POWERS[n.power];
  markActive();
  duel(n.level + 30, { name: n.name, power: n.power }, context, () => {
    n.losses++;
    fx({ rep: rand(6, 12), happy: 10, control: 2, level: rand(1, 3) });
    say(`⚔️ You ${pick(POWERS[s.power].verbs)} your nemesis ${n.name} and won the battle!`, 'good');
    const choices = isHero()
      ? [
        { label: 'Hand them over to the authorities', fn: () => { n.jailed = rand(3, 8); s.stats.defeated++; fx({ rep: 5 }); say(`${n.name} was locked up in Blackgate Maximum Security.`); } },
        { label: 'Let them go', fn: () => { fx({ rep: -3 }); say(`You let ${n.name} escape. They swore they’d be back.`); } },
      ]
      : [
        { label: 'Finish them for good', fn: () => { n.alive = false; s.stats.defeated++; fx({ rep: 15, heat: 25, happy: 5 }); say(`💀 You destroyed your nemesis ${n.name}. The world mourns its fallen hero.`, 'bad'); } },
        { label: 'Humiliate them on live TV', fn: () => { fx({ rep: 10, heat: 10 }); say(`You broadcast ${n.name}’s defeat to the whole world.`); } },
        { label: 'Leave them beaten', fn: () => { say(`You left ${n.name} beaten in the rubble.`); } },
      ];
    popup({ emoji: '🏆', title: 'Victory!', text: `You ${pick(POWERS[s.power].verbs)} <b>${n.name}</b>! Their ${np.name.toLowerCase()} was no match for you.<br><br>What now?`, choices });
  }, () => {
    n.wins++;
    const dmg = injure(12, 35, `a battle with ${n.name}`);
    fx({ rep: -rand(3, 8), happy: -10, sus: 6 });
    say(`💥 Your nemesis ${n.name} defeated you in battle. (-${dmg} health)`, 'bad');
    result('💥', 'Defeated', `<b>${n.name}</b> used ${np.name.toLowerCase()} to beat you badly. You barely escaped with your life. (-${dmg} health)`);
  });
}

function actBuyCostume() {

  const cost = Math.round(next.cost * priceMult());
  if (G.money < cost) return toast(`You need ${money(cost)}.`);
  G.money -= cost; s.costume++;
  say(`🎭 You upgraded to a ${next.name}.`);
  toast(`New costume: ${next.name}`);
}

function actBuyGadget(g) {
  const s = G.super;
  const cost = Math.round(g.cost * priceMult());
  if (s.gadgets.includes(g.id)) return;
  if (G.money < cost) return toast(`You need ${money(cost)}.`);
  G.money -= cost; s.gadgets.push(g.id);
  say(`${g.emoji} You ${pw('gadget', 1) < 1 ? 'built' : 'bought'} a ${g.name}.`);
  toast(`Got: ${g.name}`);
}

function actBuyBase() {

function actJoinTeam(t) {

  (G.districts || []).forEach(d => { d.owner = null; });
  if (s.nemesis) { say(`Your old nemesis ${s.nemesis.name} can’t believe you switched sides.`); s.nemesis = null; }

function arrestEvent() {
  const s = G.super;
  const hero = isHero();
  const bribe = 50000 * Math.ceil(s.heat / 20);
  popup({
    emoji: '🚨', title: 'Surrounded!',
    text: hero
      ? `The Metahuman Response Unit has you surrounded. You’re wanted for illegal vigilante activity.`
      : `SWAT teams and the Metahuman Response Unit have tracked you down. Spotlights. Helicopters. Power-dampening cuffs. “${esc(s.alias)}, come out with your hands up!”`,
    choices: [
      { label: 'Surrender and face trial', fn: () => trial(hero ? 'illegal vigilante activity' : 'super-crimes', Math.max(1, Math.round(2 + s.heat / 12)), () => { s.heat = clamp(s.heat - 25); }) },
      { label: 'Fight your way out', fn: () => {
        if (chance(winChance(55))) { fx({ heat: 10, rep: 5 }); say('💥 You fought off an entire police squad and escaped!', 'good'); result('💥', 'Escaped!', 'You smashed through the police line and vanished into the night. (+heat)'); }
        else { const dmg = injure(15, 30, 'a battle with police'); if (G.stats.health > 0) goToPrison(Math.round(4 + s.heat / 8), `You fought hard but they overwhelmed you. (-${dmg} health)`); }
      } },
      { label: 'Escape with your powers', show: () => pw('escape') > 0, fn: () => {
        if (chance(0.25 + pw('escape') / 100)) { fx({ heat: -10 }); say('🌀 You used your powers to slip away from the police.', 'good'); result('🌀', 'Gone!', 'One second you were there, the next you were gone. The cops are baffled.'); }
        else goToPrison(Math.round(3 + s.heat / 10), 'Your escape failed — they were ready for your powers.');
      } },
      { label: `Bribe them (${money(bribe)})`, show: () => G.money >= bribe, fn: () => { G.money -= bribe; s.heat = clamp(s.heat - 30); say(`💰 You bribed your way out of an arrest for ${money(bribe)}.`); } },
    ],
  });
}

function goToPrison(years, why) {
  const s = G.super;
  G.prison = years;
  G.flags.wasJailed = true;
  if (G.job) { say(`You lost your job as a ${jobTitle(G.job)}.`, 'bad'); G.job = null; }
  if (G.edu.stage === 'University' || G.edu.stage === 'Graduate School') G.edu.stage = '';
  if (s) {
    s.heat = 0; s.team = null;
    if (!s.exposed) exposeIdentity('When the police pulled off your mask in custody, the cameras were rolling.');
  }
  say(`⛓️ You were sentenced to ${years} years in Blackgate Maximum Security Prison.`, 'bad');
  result('⛓️', 'Sentenced', `${why}<br><br>You were sentenced to <b>${years} years</b> in Blackgate Maximum Security Prison.`);
}

function actBreakOut() {
  if (!once('breakout')) return;
  const bonus = G.super ? pw('escape') / 100 + G.super.level / 300 : 0;
  if (chance(0.08 + bonus)) {
    G.prison = 0;
    G.flags.brokeOut = true;
    if (G.super) fx({ heat: 40, rep: 6 });
    say('🔓 You broke out of prison!', 'good');
    result('🔓', 'Jailbreak!', 'You broke out of Blackgate in the middle of the night. You’re free — but every cop in the country is looking for you.');
  } else {
    G.prison += 2;
    injure(5, 15, 'a failed prison break');
    say('🚨 Your escape attempt failed. Two years were added to your sentence.', 'bad');
    result('🚨', 'Caught', 'The guards caught you halfway over the wall. +2 years to your sentence.');
  }
}

function eligible(list, ageCheck) {
  return list.filter(e => (!ageCheck || (G.age >= e.min && G.age <= e.max))
    && !(e.once && G.flags['ev_' + e.id])
    && (!e.cond || e.cond()));
}
function weightedPick(list) {
  const total = list.reduce((t, e) => t + (e.w || 1), 0);
  let r = Math.random() * total;
  for (const e of list) { r -= (e.w || 1); if (r <= 0) return e; }
  return list[list.length - 1];
}
function fireEvent(e) {
  if (e.once) G.flags['ev_' + e.id] = true;
  e.fire();
}

function runYearEvents() {
  if (G.prison > 0) {
    if (chance(0.3)) {
      const d = rand(5, 15);
      popup({ emoji: '⛓️', title: 'Prison Yard', text: 'A gang of inmates surrounds you in the yard.', choices: [
        { label: 'Fight', fn: () => { if (chance(G.super ? winChance(25) : 0.4)) { fx({ happy: 5 }); say('You won a prison yard fight. Nobody messes with you now.', 'good'); } else { fx({ health: -d }); G.lastInjury = 'a prison fight'; say(`You lost a prison yard fight. (-${d} health)`, 'bad'); } } },
        { label: 'Back down', fn: () => { fx({ happy: -6 }); say('You backed down in the prison yard.'); } },
      ] });
    }
    return;
  }
  const life = eligible(LIFE_EVENTS, true);
  if (life.length && chance(0.65)) {
    const e = weightedPick(life);
    fireEvent(e);
    const rest = life.filter(x => x !== e);
    if (rest.length && chance(0.15)) fireEvent(weightedPick(rest));
  }
  if (G.super && !G.super.retired) {
    const sup = eligible(SUPER_EVENTS, false);
    if (sup.length && chance(0.6)) fireEvent(weightedPick(sup));
  }
}

    fx({ sus: 20 });

function personEmoji(p) {
  if (!p.alive) return '🪦';
  const m = p.gender === 'm';
  const k = p.skin || '';
  if (p.age < 4) return '👶' + k;
  if (p.age < 13) return (m ? '👦' : '👧') + k;
  if (p.age < 60) return (m ? '👨' : '👩') + k;
  return (m ? '👴' : '👵') + k;
}

// Immersive multi-step activities ("adventures"). Each one is a short chain of scenes with choices.

const FX_LABELS = { happy: '😊 Happiness', health: '❤️ Health', smarts: '🧠 Smarts', looks: '✨ Looks', money: '💰', rep: '🌟 Reputation', control: '🎯 Control', level: '⚡ Power' };

function fxSummary(o) {
  if (!o) return '';
  const parts = Object.entries(o).filter(([k, v]) => v && FX_LABELS[k]).map(([k, v]) =>
    k === 'money' ? `💰 ${v > 0 ? '+' : '-'}${money(Math.abs(v)).replace('-', '')}` : `${FX_LABELS[k]} ${v > 0 ? '+' : ''}${v}`);
  if (o.sus > 0) parts.push('🎭 Suspicion up');
  return parts.length ? `<div class="fx-summary">${parts.join(' · ')}</div>` : '';
}

// A scene in an adventure.
function scene(emoji, title, text, choices) {
  popup({ emoji, title, text, cls: 'adventure', choices });
}
// The final scene: apply effects, log it, show a summary.
function finish(emoji, title, text, effects, log, cls) {
  fx(effects);
  if (log) say(log, cls);
  popup({ emoji, title, text: text + fxSummary(effects), cls: 'adventure', choices: [{ label: 'Done' }] });
}

// ---------- 5. Casino ----------
function advCasino() {
  if (G.money < 100) return toast('You need at least $100 to gamble.');
  if (!once('adv_casino')) return;
  const bets = () => [100, 1000, 10000, 100000].filter(b => b <= G.money);
  const play = (game) => scene(game.emoji, game.name, `${game.desc}<br><br>How much are you betting?`, bets().map(b => ({ label: money(b), fn: () => game.run(b) }))
    .concat([{ label: `All in (${money(G.money)})`, cls: 'danger', fn: () => game.run(G.money) }]));
  const win = (bet, mult, msg) => finish('🤑', 'Winner!', `${msg}<br><br>You won <b>${money(bet * mult)}</b>!`, { money: bet * mult, happy: Math.min(25, 5 + Math.round(Math.log10(bet * mult) * 2)) }, `🎰 You won ${money(bet * mult)} at the Golden Vault Casino.`, 'good');
  const lose = (bet, msg) => finish('💸', 'House Wins', `${msg}<br><br>You lost <b>${money(bet)}</b>.`, { money: -bet, happy: -Math.min(20, 3 + Math.round(Math.log10(bet) * 2)) }, `🎰 You lost ${money(bet)} at the Golden Vault Casino.`, 'bad');
  const games = [
    { name: 'Slot Machines', emoji: '🎰', desc: 'Lights flash, bells ring. Three cherries pays big.', run: b => {
      const r = Math.random();
      if (r < 0.02) win(b, 20, '🍒🍒🍒 JACKPOT! Sirens go off and everyone turns to look.');
      else if (r < 0.3) win(b, 1, '🍋🍋🔔 A small win. You doubled your bet.');
      else lose(b, '🍋🔔⭐ Nothing.');
    } },
    { name: 'Blackjack', emoji: '🃏', desc: 'Get closer to 21 than the dealer without going over.', run: b => {
      const you = rand(12, 20), dealerShows = rand(2, 11);
      scene('🃏', 'Your Hand', `You have <b>${you}</b>. The dealer is showing a <b>${dealerShows}</b>.`, [
        { label: 'Hit', fn: () => { const n = you + rand(2, 11); n > 21 ? lose(b, `You drew to ${n}. Bust!`) : resolveBJ(b, n); } },
        { label: 'Stand', fn: () => resolveBJ(b, you) },
        { label: '🧠 Read the dealer’s mind', show: () => hasPower() && (pw('wipe') || G.super.power === 'precog' || G.super.power === 'time'), fn: () => { fx({ sus: 4 }); win(b, 1, 'You know exactly what card is coming. You play it perfectly.'); } },
      ]);
    } },
    { name: 'Roulette', emoji: '🎡', desc: 'The wheel spins. Red or black doubles your money. A single number pays 35 to 1.', run: b => scene('🎡', 'Place Your Bet', 'Where do you put your chips?', [
      { label: '🔴 Red', fn: () => chance(18 / 38) ? win(b, 1, 'The ball lands on red 23!') : lose(b, 'The ball lands on black 8.') },
      { label: '⚫ Black', fn: () => chance(18 / 38) ? win(b, 1, 'The ball lands on black 17!') : lose(b, 'The ball lands on red 3.') },
      { label: `🎯 Lucky number ${G.age % 36 + 1}`, fn: () => chance(1 / 38) ? win(b, 35, `The ball drops right into ${G.age % 36 + 1}. The whole table screams.`) : lose(b, 'The ball bounces past your number.') },
    ]) },
  ];
  function resolveBJ(b, you) {
    const dealer = rand(16, 23);
    if (dealer > 21) win(b, 1, `You stand on ${you}. The dealer busts with ${dealer}!`);
    else if (you > dealer) win(b, 1, `Your ${you} beats the dealer’s ${dealer}.`);
    else if (you === dealer) finish('🤝', 'Push', `You and the dealer both have ${you}. You keep your bet.`, null, null);
    else lose(b, `The dealer’s ${dealer} beats your ${you}.`);
  }
  scene('🎲', 'Golden Vault Casino', 'Carpet with a dizzying pattern, no clocks anywhere, and free drinks for anyone holding chips. Pick your game.', games.map(g => ({ label: `${g.emoji} ${g.name}`, fn: () => play(g) })).concat([{ label: 'Walk away' }]));
}

const TRAIT_EMOJI = { Funny: '😂', Sporty: '⚽', Nerdy: '🤓', Artsy: '🎨', Rebellious: '🤘', Kind: '🤗', Rich: '💎', Gamer: '🎮', Adventurous: '🧗', Bookworm: '📚', 'Party Animal': '🥳', Musician: '🎸' };

const HANGOUTS = [
  { id: 'school', emoji: '🏫', name: 'Around school', sub: 'Classmates your age', cond: () => ['Elementary School', 'Middle School', 'High School', 'University', 'Graduate School'].includes(G.edu.stage) },

];

function actMakeFriends() {
  if (G.prison > 0) return toast('Not much of a social scene in here.');
  popup({ emoji: '🤝', title: 'Make Friends', text: 'Where do you want to meet new people?', choices: HANGOUTS.filter(hg => hg.cond()).map(hg => ({
    label: `${hg.emoji} ${hg.name}`, hint: hg.sub, fn: () => meetPeople(hg),
  })).concat([{ label: 'Never mind' }]) });
}

function meetPeople(hg) {
  if (!once('meet_' + hg.id)) return;
  const [lo, hi] = hg.id === 'school' ? [G.age - 1, G.age + 1] : hg.id === 'park' ? [Math.max(5, G.age - 15), G.age + 25] : [Math.max(5, G.age - 6), G.age + 8];
  const people = [0, 1, 2].map(() => ({ ...randomPerson(null, Math.max(5, lo), Math.max(5, hi)), trait: pick(FRIEND_TRAITS) }));
  popup({ emoji: hg.emoji, title: hg.name, text: 'You notice a few people. Who do you want to talk to? (You only have time for one.)', choices: people.map(p => ({
    label: `${TRAIT_EMOJI[p.trait]} ${p.first} ${p.last}`, hint: `${p.trait} · age ${p.age}`,
    fn: () => approach(p, hg),
  })).concat([{ label: 'Go home' }]) });
}

function approach(p, hg) {
  const openers = {
    Funny: 'You crack a joke about the weather.', Sporty: 'You ask what team they play for.', Nerdy: 'You ask about the book they’re reading.',
    Artsy: 'You compliment their sketchbook.', Rebellious: 'You compliment their leather jacket.', Kind: 'You help them pick up something they dropped.',
    Rich: 'You ask where they got their very expensive sneakers.', Gamer: 'You notice their gaming hoodie and ask what they’re playing.',
    Adventurous: 'You ask about their climbing gear.', Bookworm: 'You recommend a book.', 'Party Animal': 'You ask where the party is this weekend.', Musician: 'You ask about their guitar case.',
  };
  popup({ emoji: TRAIT_EMOJI[p.trait], title: p.first, text: `${openers[p.trait]}<br><br>How do you play it?`, choices: [
    { label: '😄 Be yourself', fn: () => tryFriend(p, 0.55 + G.stats.happy / 300) },
    { label: '😎 Try to look cool', fn: () => tryFriend(p, 0.3 + G.stats.looks / 160) },
    { label: '🧠 Have a deep conversation', fn: () => tryFriend(p, 0.3 + G.stats.smarts / 160) },
    { label: '🎁 Offer to buy them a snack ($10)', show: () => G.money >= 10, fn: () => { G.money -= 10; tryFriend(p, 0.75); } },
  ] });
}

function tryFriend(p, odds) {
  if (chance(odds)) {
    const f = addPerson({ ...p, role: 'Friend', bond: rand(50, 75) });
    fx({ happy: rand(4, 8) });
    say(`🤝 You became friends with ${fullName(f)} (${f.trait.toLowerCase()}).`, 'good');
    result(TRAIT_EMOJI[f.trait], 'New Friend!', `You and <b>${f.first}</b> hit it off! You can hang out with them from the People tab.`);
  } else {
    fx({ happy: -3 });
    say(`You tried to make friends with ${p.first}, but it was awkward.`);
    result('😬', 'Awkward…', `${p.first} gives you a weird look and finds a reason to leave.`);
  }
}

    { label: '👋 End the friendship', fn: () => { p.role = 'Former Friend'; fx({ happy: -3 }); say(`👋 You ended your friendship with ${fullName(p)}.`); } },
  ];

const RESALE = { wear: 0.1, car: 0.85, home: 1, luxury: 0.5 };
const rnd = v => Array.isArray(v) ? rand(v[0], v[1]) : (v || 0);

function owned(id) { return (G.assets || []).filter(a => a.id === id); }
function assetValue() { return (G.assets || []).reduce((t, a) => t + (a.kind === 'wear' ? 0 : a.value), 0); }
function netWorth() { return G.money - G.debt + assetValue() + invested(); }

function buyItem(it) {
  if (G.age < it.min) return toast(`You need to be ${it.min} for that.`);
  if (G.prison > 0) return toast('You can’t go shopping from prison.');
  if (it.kind === 'rent') return rentApartment();
  if (G.money < it.cost) return toast(`You need ${money(it.cost)}.`);
  if (it.kind === 'care') {
    if (!once('care_' + it.id)) return;
    G.money -= it.cost;
    if (it.risky && chance(0.15)) {
      fx({ looks: -rand(10, 20), happy: -15 });
      say(`💉 Your ${it.name.toLowerCase()} was botched.`, 'bad');
      return result('😱', 'Botched!', 'The surgeon made a terrible mistake. You look worse than before.');
    }
    const eff = { looks: rnd(it.looks), happy: rnd(it.happy), health: rnd(it.health) };
    fx(eff);
    say(`${it.emoji} You got a ${it.name.toLowerCase()}.`);
    return toast(`${it.name}: Looks +${eff.looks}`);
  }
  if (it.kind === 'wear' && owned(it.id).length) return toast('You already own that.');
  G.money -= it.cost;
  G.assets.push({ id: it.id, kind: it.kind, name: it.name, emoji: it.emoji, value: it.cost, paid: it.cost, age: G.age });
  fx({ looks: rnd(it.looks), happy: rnd(it.happy), health: rnd(it.health), smarts: rnd(it.smarts) });
  if (it.kind === 'home' && G.renting) { G.renting = false; say('You moved out of your rented apartment.'); }
  say(`${it.emoji} You bought a ${it.name} for ${money(it.cost)}.`, 'good');
  result(it.emoji, 'Purchased!', `You bought a <b>${it.name}</b> for ${money(it.cost)}.${it.kind === 'home' ? '<br><br>Homes can grow in value over time.' : it.kind === 'car' ? '<br><br>Cars lose value every year and cost money to keep up.' : ''}`);
}

function rentApartment() {
  if (G.renting) {
    G.renting = false; say('🏢 You moved out of your rented apartment.'); return toast('You moved out.');
  }
  G.renting = true; fx({ happy: 6 });
  say('🏢 You rented your own apartment ($1,400/month).', 'good');
  result('🏢', 'Your Own Place', 'You signed a lease on a one-bedroom apartment. Rent is $16,800 a year.');
}

function sellAsset(a) {
  const amt = Math.round(a.value * (RESALE[a.kind] ?? 0.5));
  popup({ emoji: a.emoji, title: `Sell ${a.name}?`, text: `You’d get <b>${money(amt)}</b> for it.`, choices: [
    { label: `Sell for ${money(amt)}`, fn: () => { G.assets = G.assets.filter(x => x !== a); G.money += amt; fx({ happy: -2 }); say(`You sold your ${a.name} for ${money(amt)}.`); } },
    { label: 'Keep it' },
  ] });
}

// Yearly: depreciation, appreciation, upkeep, rent, and a little joy from nice things.
function assetsTick() {
  if (!G.assets) return;
  let upkeep = 0, joy = 0;
  G.assets.forEach(a => {
    if (a.kind === 'car') { a.value = Math.round(a.value * 0.86); upkeep += Math.round(a.paid * 0.03); joy = Math.max(joy, 1); }
    else if (a.kind === 'home') { a.value = Math.round(a.value * (1 + rand(-3, 7) / 100)); upkeep += Math.round(a.value * 0.012); joy = Math.max(joy, 3); }
    else if (a.kind === 'luxury') { a.value = Math.round(a.value * (a.id === 'art' ? 1 + rand(-5, 12) / 100 : 0.9)); upkeep += a.paid >= 100000 ? Math.round(a.paid * 0.05) : 0; }
  });
  if (G.renting && G.prison === 0) upkeep += 16800;
  if (G.prison === 0) G.money -= upkeep;
  if (joy) fx({ happy: rand(0, joy) });
  if (G.money < 0) {
    G.debt += -G.money; G.money = 0;
    say(`💳 You couldn’t cover your bills and went into debt (${money(G.debt)}).`, 'bad');
    fx({ happy: -5 });
  }
}

function livingText() {
  const homes = G.assets.filter(x => x.kind === 'home').sort((x, y) => y.value - x.value);
  if (homes.length) return homes[0].name + (homes.length > 1 ? ` (+${homes.length - 1} other propert${homes.length === 2 ? 'y' : 'ies'})` : '');
  return G.renting ? 'Rented apartment' : G.age < 18 ? 'With your family' : 'With your parents';
}

    : item(it))));

  if (a >= 18) out.append(section(`Investing · ${money(invested())} invested`, FUNDS.map(f => row(f.emoji, f.name, `${f.desc}${G.invest && G.invest[f.id] ? ` · <b>${money(G.invest[f.id])}</b>` : ''}`, () => fundActions(f)))));

// Turn-based super battles and signature moves.

const MOVE_WORDS = {
  a: ['Omega', 'Crimson', 'Final', 'Thunder', 'Phantom', 'Nova', 'Titan', 'Eclipse', 'Dragon', 'Infinity', 'Shadow', 'Solar'],
  b: ['Strike', 'Barrage', 'Cyclone', 'Burst', 'Crash', 'Fury', 'Cannon', 'Storm', 'Breaker', 'Judgment', 'Nova', 'Requiem'],
};
const MOVE_TIERS = [
  { level: 25, tier: 1, dmg: [24, 32], label: 'Technique' },
  { level: 50, tier: 2, dmg: [32, 42], label: 'Ultimate' },
  { level: 75, tier: 3, dmg: [44, 56], label: 'Legendary Finisher' },
];

function bestMove() {
  const m = (G.super.moves || []);
  return m.length ? m.reduce((a, b) => (b.tier > a.tier ? b : a)) : null;
}

// Offers to name a new signature move when a power threshold is crossed. Returns true if one was queued.
function checkMoves() {
  const s = G.super;
  if (!s || !s.alignment) return false;
  s.moves = s.moves || [];
  const t = MOVE_TIERS.find(t => s.level >= t.level && !s.moves.some(m => m.tier === t.tier));
  if (!t) return false;
  const p = POWERS[s.power];
  const sugg = shuffle([...new Set(Array.from({ length: 8 }, () => `${pick(MOVE_WORDS.a)} ${pick(MOVE_WORDS.b)}`))]).slice(0, 5);
  Q.push({
    emoji: '🌟', title: `New ${t.label}!`, cls: 'origin',
    text: `Your ${p.name.toLowerCase()} has reached power ${t.level}. You’ve developed a devastating new move you can use once per battle.<br><br>What do you call it?`,
    input: { placeholder: 'Name your move', suggestions: sugg, max: 26 },
    choices: [{ label: 'Lock it in', fn: v => {
      const name = v || sugg[0];
      s.moves.push({ name, tier: t.tier, dmg: t.dmg });
      sfx('power');
      say(`🌟 ${esc(s.alias)} learned a new signature move: <b>${esc(name)}</b>!`, 'super');
    } }],
  });
  return true;
}

// Converts an old-style difficulty number into an enemy combat rating.
function ratingFor(diff) { return Math.max(10, (diff + 10) / 1.2); }

const HIT_WORDS = ['POW!', 'BAM!', 'WHAM!', 'KRAK!', 'ZAP!', 'THWACK!', 'SMASH!', 'KAPOW!'];
function backupAlly() {
  const s = G.super, sp = superPartner();
  if (sp) return { name: sp.superAlias, text: `${sp.superAlias} swoops in beside you!` };
  if (s.sidekick) return { name: s.sidekick.name, text: `${s.sidekick.name} charges in to help!` };
  if (s.team) return { name: s.team.name, text: `${s.team.name} answers the call!` };
  const pet = livingPets().find(p => p.powered);
  if (pet) return { name: pet.name, text: `${pet.name} the super ${pet.kind.toLowerCase()} leaps into the fight!` };
  return null;
}
// Comic-book hit bursts and screen shake, applied after the battle card renders.
function battleFx(B) {
  return card => {
    if (B.burst) {
      const b = document.createElement('div');
      b.className = `burst ${B.burst.big ? 'big' : ''}`;
      b.textContent = B.burst.word;
      card.append(b);
    }
    if (B.hurt) card.classList.add('shake');
    B.burst = null; B.hurt = false;
  };
}

function hpBar(label, v, cls) {
  return `<div class="hp"><span>${esc(label)}</span><div class="hp-bar"><div class="hp-fill ${cls}" style="width:${Math.max(0, v)}%"></div></div><b>${Math.max(0, Math.round(v))}</b></div>`;
}

// Start a battle. enemy: { name, power }. onWin/onLose run afterward.
function duel(diff, enemy, intro, onWin, onLose, opts = {}) {
  const B = {
    you: 100, foe: 100, stamina: 2, guard: false, sigUsed: false, gadgetUsed: false, turn: 1, log: '',
    enemy: { ...enemy, rating: ratingFor(diff), emoji: POWERS[enemy.power] ? POWERS[enemy.power].emoji : '👊' },
    diff, intro, onWin, onLose, canFlee: opts.canFlee !== false, onFlee: opts.onFlee,
  };
  sfx('battle');
  battleTurn(B);
}

function battleTurn(B) {
  const s = G.super;
  const sig = bestMove();
  const p = POWERS[s.power];
  popup({
    emoji: '⚔️', title: B.turn === 1 ? `VS ${B.enemy.name}` : `Round ${B.turn}`, cls: 'battle', grid: true, after: battleFx(B),
    text: `${B.turn === 1 && B.intro ? `<p>${B.intro}</p>` : ''}${B.log ? `<div class="blog">${B.log}</div>` : ''}
      ${hpBar(s.alias, B.you, 'you')}${hpBar(B.enemy.name, B.foe, 'foe')}
      <div class="stam">Stamina ${'⚡'.repeat(B.stamina) || '—'}</div>`,
    choices: [
      { label: '👊 Strike', hint: 'Reliable hit', fn: () => playerMove(B, 'strike') },
      { label: `${p.emoji} ${p.kind === 'skill' ? 'Skill Combo' : 'Power Blast'}`, hint: B.stamina > 0 ? 'Heavy hit · 1 stamina' : 'No stamina', fn: () => B.stamina > 0 ? playerMove(B, 'power') : battleTurn(B) },
      { label: '🛡️ Defend', hint: 'Block · +1 stamina', fn: () => playerMove(B, 'defend') },
      { label: `🌟 ${sig ? sig.name : ''}`, hint: 'Signature move', cls: 'sig', show: () => sig && !B.sigUsed, fn: () => playerMove(B, 'sig') },
      { label: '🧰 Gadget', hint: 'Can’t miss', show: () => s.gadgets.length && !B.gadgetUsed, fn: () => playerMove(B, 'gadget') },
      { label: '📞 Call backup', hint: backupAlly() ? backupAlly().name : '', show: () => backupAlly() && !B.backupUsed, fn: () => playerMove(B, 'backup') },
      { label: '🏃 Flee', hint: 'Escape the fight', show: () => B.canFlee, fn: () => flee(B) },
      { label: '⏩ Auto', hint: 'Skip to the end', fn: () => autoFinish(B) },
    ],
  });
}

function playerMove(B, kind) {
  const s = G.super;
  const r = Math.sqrt(combatScore() / B.enemy.rating);
  const verb = pick(POWERS[s.power].verbs);
  let dmg = 0, text = '';
  B.guard = false;
  if (kind === 'strike') {
    if (chance(0.9)) { dmg = rand(7, 12) * r; text = `You land a solid hit.`; } else text = 'You swing and miss!';
  } else if (kind === 'power') {
    B.stamina--;
    if (chance(0.75)) { dmg = rand(14, 22) * r; text = `You ${verb} ${B.enemy.name}!`; } else text = `${B.enemy.name} dodges your attack!`;
  } else if (kind === 'sig') {
    const m = bestMove(); B.sigUsed = true;
    dmg = rand(m.dmg[0], m.dmg[1]) * Math.max(1, r); text = `<b>${esc(m.name.toUpperCase())}!</b> The ground shakes.`;
    sfx('power');
  } else if (kind === 'gadget') {
    B.gadgetUsed = true;
    const gid = pick(s.gadgets);
    const g = GADGETS.find(x => x.id === gid);
    dmg = (8 + gadgetBonus()) * r; text = `You hit them with your ${g.name.toLowerCase()}!`;
  } else if (kind === 'backup') {
    B.backupUsed = true;
    const a = backupAlly();
    dmg = rand(16, 26) * Math.max(0.8, r); text = a.text;
  } else if (kind === 'defend') {
    B.guard = true; B.stamina = Math.min(3, B.stamina + 1); text = 'You brace yourself.';
  }
  B.foe -= Math.round(dmg);
  if (dmg) { sfx('hit'); B.burst = { word: kind === 'sig' ? 'KA-BOOOM!' : pick(HIT_WORDS), big: kind === 'sig' || dmg > 22 }; }
  B.log = `${text}${dmg ? ` <b>-${Math.round(dmg)}</b>` : ''}`;
  if (B.foe <= 0) return endBattle(B, true);
  enemyMove(B, r);
}

function enemyMove(B, r) {
  const s = G.super;
  let mult = pw('armor', 1) * (COSTUMES[s.costume].armor || 1);
  if (B.guard) mult *= 0.3;
  const special = B.turn % 3 === 0;
  let dmg = 0, text;
  if (chance(special ? 0.7 : 0.85)) {
    dmg = Math.round(rand(7, 13) / r * (special ? 1.7 : 1) * mult);
    const ep = POWERS[B.enemy.power];
    text = special && ep ? `${B.enemy.name} unleashes their ${ep.name.toLowerCase()}! <b>-${dmg}</b>` : `${B.enemy.name} hits back. <b>-${dmg}</b>`;
  } else text = `${B.enemy.name} misses!`;
  B.you -= dmg;
  if (dmg > 0) B.hurt = true;
  B.log += `<br>${text}`;
  B.turn++;
  if (B.you <= 0) return endBattle(B, false);
  battleTurn(B);
}

function flee(B) {
  if (chance(0.45 + pw('escape') / 100)) {
    G.stats.health = clamp(G.stats.health - Math.round((100 - B.you) * 0.15));
    say(`🏃 You fled from a fight with ${B.enemy.name}.`);
    fx({ rep: -3, happy: -3 });
    if (B.onFlee) B.onFlee(); else result('🏃', 'Escaped', `You got away from ${B.enemy.name}. Not your proudest moment.`);
  } else {
    B.log = 'You try to run, but they cut you off!';
    enemyMove(B, Math.sqrt(combatScore() / B.enemy.rating));
  }
}

function autoFinish(B) {
  const base = winChance(B.diff);
  endBattle(B, chance(clamp(base + (B.you - B.foe) / 200, 0.03, 0.97)), true);
}

function endBattle(B, won, auto) {
  const s = G.super;
  if (won) {
    // Winning still leaves scrapes; losing is handled by each fight's own injury.
    if (!auto) G.stats.health = clamp(G.stats.health - Math.round((100 - B.you) * 0.15));
    s.wins = (s.wins || 0) + 1;
    sfx('good');
    B.onWin();
  } else {
    sfx('bad');
    B.onLose();
  }
}

// The city map (districts heroes protect and villains take over) and yearly newspaper headlines.

const DISTRICTS = [
  { name: 'Downtown', emoji: '🏙️' }, { name: 'Harbor District', emoji: '⚓' }, { name: 'Old Town', emoji: '🏚️' },
  { name: 'Tech Park', emoji: '🧪' }, { name: 'Lantern Quarter', emoji: '🏮' }, { name: 'Southside', emoji: '🏘️' },
];

function initCity() { G.districts = DISTRICTS.map(d => ({ ...d, crime: rand(25, 75), owner: null })); }
function safeDistricts() { return (G.districts || []).filter(d => d.crime <= 15 && !d.owner); }
function ownedDistricts() { return (G.districts || []).filter(d => d.owner === 'you'); }
function cityCrime() { const d = G.districts || []; return d.length ? Math.round(d.reduce((t, x) => t + x.crime, 0) / d.length) : 50; }

function actProtectDistrict(d) {
  if (!spendEnergy()) return;
  const s = G.super;
  markActive();
  if (chance(winChance(10 + d.crime / 2))) {
    const drop = rand(15, 30), saved = rand(2, 20);
    d.crime = clamp(d.crime - drop);
    s.stats.saved += saved;
    fx({ rep: rand(2, 4), happy: 4, sus: rand(2, 5) });
    say(`🛡️ You cleaned up the streets of ${d.name}. Crime fell ${drop}%.`, 'good');
    result(d.emoji, d.crime <= 15 ? `${d.name} Is Safe!` : `${d.name} Cleaned Up`, `You spent the night breaking up gangs and stopping robberies in ${d.name}.<br><br>Crime: <b>${d.crime}%</b> (−${drop}) · 👥 ${saved} people saved${d.crime <= 15 ? '<br><br>Safe districts boost your fame every year.' : ''}`);
  } else {
    const dmg = injure(6, 16, `a gang fight in ${d.name}`);
    fx({ rep: -2, happy: -4, sus: 4 });
    say(`🤕 A gang in ${d.name} was too much for you. (-${dmg} health)`, 'bad');
    result('🤕', 'Outnumbered', `The ${d.name} gangs were ready for you. (-${dmg} health)`);
  }
}

function actTakeDistrict(d) {
  if (!spendEnergy()) return;
  markActive();
  const diff = 20 + Math.round((100 - d.crime) / 3) + ownedDistricts().length * 4;
  duel(diff, { name: `${d.name} Crime Boss`, power: 'martial' }, `To take over ${d.name}, you’ll have to defeat the crime boss who runs it.`, () => {
    d.owner = 'you'; d.crime = clamp(d.crime + 15, 60, 100);
    fx({ rep: rand(4, 7), heat: rand(6, 10), happy: 6 });
    say(`🏴 You took over ${d.name}. Every business there now pays you.`, 'good');
    result('🏴', `${d.name} Is Yours`, `The old crime boss is gone. ${d.name} now belongs to <b>${esc(alias())}</b>. You’ll collect protection money every year.`);
  }, () => {
    const dmg = injure(10, 22, `a turf war in ${d.name}`);
    fx({ heat: 8, happy: -6 });
    say(`🤕 You failed to take over ${d.name}. (-${dmg} health)`, 'bad');
    result('🤕', 'Turf War Lost', `The ${d.name} crime boss beat you back. (-${dmg} health)`);
  });
}

function cityYearly() {
  const s = G.super;
  if (!G.districts) initCity();
  G.districts.forEach(d => { d.crime = clamp(d.crime + rand(-2, 6), d.owner ? 60 : 0, 100); });
  if (isHero()) {
    const safe = safeDistricts().length;
    if (safe) fx({ rep: safe });
  } else {
    const mine = ownedDistricts();
    if (mine.length) {
      const cash = mine.reduce(t => t + Math.round(rand(30000, 90000) * (1 + s.level / 100)), 0);
      G.money += cash; s.heat = clamp(s.heat + mine.length * 2);
      say(`💼 Your ${mine.length} district${mine.length > 1 ? 's' : ''} paid you ${money(cash)} in protection money.`);
      // Heroes sometimes liberate a district.
      if (chance(0.15)) { const d = pick(mine); d.owner = null; d.crime = 50; say(`🦸 Heroes liberated ${d.name} from your control.`, 'bad'); }
    }
  }
}

function cityRows() {
  const hero = isHero();
  return (G.districts || []).map(d => {
    const status = d.owner === 'you' ? '🏴 Yours' : d.crime <= 15 ? '✅ Safe' : d.crime >= 70 ? '🔥 Dangerous' : '';
    const sub = `Crime ${d.crime}%${status ? ' · ' + status : ''} · 1 energy`;
    if (hero) return row(d.emoji, `Protect ${d.name}`, sub, () => actProtectDistrict(d), { disabled: d.crime <= 5, why: `${d.name} is already spotless.` });
    return row(d.emoji, d.owner === 'you' ? d.name : `Take over ${d.name}`, d.owner === 'you' ? `Yours · pays protection money yearly` : sub, () => actTakeDistrict(d), { disabled: d.owner === 'you', why: 'You already run it.' });
  });
}

function cityMap() {
  const ds = G.districts || [];
  return h('div', { class: 'city-map' }, ds.map(d => h('div', {
    class: `district ${d.owner === 'you' ? 'owned' : d.crime <= 15 ? 'safe' : d.crime >= 70 ? 'danger' : ''}`,

  }, h('span', { class: 'd-emoji' }, d.emoji), h('b', {}, d.name), h('small', {}, d.owner === 'you' ? 'Yours' : `${d.crime}% crime`))));
}

    `${d.name.toUpperCase()} LIVES IN FEAR OF ${A}`, `IS ANYONE SAFE FROM ${A}?`,
  ];
  if (n && n.alive) opts.push(`${A} VS. ${n.name.toUpperCase()}: THE FEUD CONTINUES`);

// ---------- social media ----------
function followersText(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n); }
function socialPost(kind) {
  if (!once('post_' + kind)) return;
  G.social = G.social || { followers: 0 };
  const sc = G.social;
  const base = { selfie: 20 + G.stats.looks * 4, meme: 50 + G.stats.smarts * 2, stream: 30 + G.stats.smarts * 2 + G.stats.looks * 2, hero: 400 + (G.super ? G.super.rep * 40 : 0), dance: 40 + G.stats.looks * 3 }[kind];
  let gain = Math.round(base * (1 + Math.sqrt(sc.followers) / 60) * (0.5 + Math.random()));
  let viral = chance(kind === 'hero' ? 0.2 : 0.05);
  if (viral) gain *= rand(8, 25);
  let flop = !viral && chance(0.15);
  if (flop) gain = -Math.round(sc.followers * 0.02);
  sc.followers = Math.max(0, sc.followers + gain);
  const what = { selfie: 'a selfie', meme: 'a meme', stream: 'a livestream', hero: `blurry footage of ${G.super ? esc(G.super.alias) : 'a superhero'}`, dance: 'a dance video' }[kind];
  if (kind === 'hero') fx({ sus: 8 });
  fx({ happy: viral ? 12 : flop ? -4 : 3 });
  if (!sc.verified && sc.followers >= 100000) { sc.verified = true; say('✔️ Your account got verified!', 'good'); }
  say(`📱 You posted ${what}${viral ? ' and it went VIRAL' : flop ? ' and lost followers' : ''}. (${followersText(sc.followers)} followers)`, viral ? 'good' : '');
  if (viral) result('🔥', 'Viral!', `Your post exploded. You gained <b>${followersText(gain)}</b> followers overnight.`);
  else toast(flop ? `Flopped… ${followersText(sc.followers)} followers` : `+${followersText(gain)} followers`);
}
function socialTick() {
  const sc = G.social;
  if (!sc || sc.followers < 10000) return;
  const pay = Math.round(sc.followers / 1000 * rand(60, 140));
  G.money += pay;
  say(`📱 Brand deals and sponsorships paid you ${money(pay)} this year.`);
  sc.followers = Math.round(sc.followers * (0.92 + Math.random() * 0.1));
}

function illnessTick() {
  G.conditions = G.conditions || [];
  G.conditions = G.conditions.filter(id => {
    const c = CONDITIONS.find(x => x.id === id);
    if (c.heals && chance(c.heals)) { say(`${c.emoji} Your ${c.name.toLowerCase()} went away on its own.`, 'good'); return false; }
    fx(c.drain);
    if (['heart', 'diabetes', 'asthma'].includes(c.id)) G.lastInjury = c.name.toLowerCase();
    return true;
  });
  if (G.super && pw('heal') && G.conditions.length && chance(0.6)) {
    const id = G.conditions.shift(); say(`🩹 Your healing factor cured your ${CONDITIONS.find(c => c.id === id).name.toLowerCase()}.`, 'good');
  }
  const pool = CONDITIONS.filter(c => G.age >= c.min && !G.conditions.includes(c.id) && (!c.super || (G.super && G.super.alignment && G.super.control < 50)));
  if (pool.length && chance(0.04 + (G.age > 50 ? 0.04 : 0) + (G.stats.health < 40 ? 0.03 : 0) + worldMod('ill', 0))) {
    const c = weightedPick(pool);
    G.conditions.push(c.id);
    say(`${c.emoji} You were diagnosed with ${c.name.toLowerCase()}.`, 'bad');
    popup({ emoji: c.emoji, title: 'Diagnosis', text: `The doctor says you have <b>${c.name}</b>. It’ll wear you down every year until it’s treated.`, choices: [
      { label: c.cost ? `Treat it now (${money(G.age < 18 ? 0 : c.cost)})` : 'Rest and recover', show: () => G.age < 18 || G.money >= c.cost, fn: () => treat(c) },
      { label: 'Deal with it later' },
    ] });
  }
}
function treat(c) {
  const cost = G.age < 18 ? 0 : c.cost;
  if (G.money < cost) return toast(`You need ${money(cost)}.`);
  if (c.id === 'burnout' && !once('rest')) return;
  G.money -= cost;

}

// ---------- sound ----------
let audioCtx = null;
function soundOn() { try { return localStorage.getItem('mysuperlife.sound') !== 'off'; } catch (e) { return true; } }
function toggleSound() { try { localStorage.setItem('mysuperlife.sound', soundOn() ? 'off' : 'on'); } catch (e) { /* ignore */ } }
function sfx(kind) {
  if (!soundOn()) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = {
      age: [[523, 0.06], [784, 0.08]], good: [[523, 0.08], [659, 0.08], [784, 0.12]], bad: [[330, 0.12], [247, 0.2]],
      power: [[392, 0.06], [587, 0.06], [880, 0.14]], hit: [[140, 0.07]], battle: [[220, 0.1], [330, 0.1], [440, 0.16]],
      achievement: [[659, 0.08], [784, 0.08], [1047, 0.2]], pop: [[880, 0.04]],
    }[kind] || [[600, 0.05]];
    let t = audioCtx.currentTime;
    notes.forEach(([f, d]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = kind === 'hit' ? 'sawtooth' : 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + d + 0.02);
      t += d * 0.9;
    });
    if (kind === 'bad' && navigator.vibrate) navigator.vibrate(60);
  } catch (e) { /* audio unavailable */ }
}
